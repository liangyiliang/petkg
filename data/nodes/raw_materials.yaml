# Purchasable inputs. Formulas are dosed in ingredients (actives) and built from these.
# `provides.fraction` = w/w of the ingredient as dosed by DoseRules. Values marked unverified
# in `description` must be replaced by the supplier's CoA before production use.

# ---- omega-3 ----------------------------------------------------------------
- id: rm:fish_oil_concentrate_rtg_60
  name: Fish oil concentrate, re-esterified TG, ~60% EPA+DHA
  physical_form: oil
  provides: [{ingredient: ingredient:omega3_epa_dha, fraction: 0.60}]
  derived_from: [allergen:fish]
  heat_max_c: 60
  oxidation_sensitive: true
  palatability: neutral
  preferred: true
  compatible_forms:
    - {form: form:liquid_oil}
    - {form: form:softgel}
    - {form: form:soft_chew_cold, notes: "<=10% oil load in the chew"}
  description: Concentrate grade; needs mixed tocopherols / rosemary; keep away from Fe/Cu premixes. Spec must meet GOED oxidation limits.
  sources: [source:goed_monograph, source:colorcon_soft_chew_case_study]
- id: rm:fish_oil_18_12_tg
  name: Fish oil 18/12, natural TG (anchovy)
  physical_form: oil
  provides: [{ingredient: ingredient:omega3_epa_dha, fraction: 0.30}]
  derived_from: [allergen:fish]
  heat_max_c: 60
  oxidation_sensitive: true
  compatible_forms: [{form: form:liquid_oil}, {form: form:softgel}, {form: form:soft_chew_cold}]
  description: 18% EPA + 12% DHA. Cheapest source but twice the volume of the concentrate.
  sources: [source:goed_monograph]
- id: rm:krill_oil
  name: Krill oil (phospholipid omega-3)
  physical_form: oil
  provides: [{ingredient: ingredient:omega3_epa_dha, fraction: 0.15}]
  derived_from: [allergen:shellfish]
  heat_max_c: 50
  oxidation_sensitive: true
  compatible_forms: [{form: form:liquid_oil}, {form: form:softgel}, {form: form:soft_chew_cold}]
  description: ">=15% omega-3 (patent spec); contains astaxanthin. Low omega-3 density means many units at therapeutic doses."
- id: rm:algal_oil_dha
  name: Algal oil (Schizochytrium), DHA-rich
  physical_form: oil
  provides: [{ingredient: ingredient:omega3_epa_dha, fraction: 0.40}]
  derived_from: []
  heat_max_c: 60
  oxidation_sensitive: true
  compatible_forms: [{form: form:liquid_oil}, {form: form:softgel}, {form: form:soft_chew_cold}]
  description: >-
    >=40% DHA, <=3% EPA. Fish-free fallback. Caution: joint and anti-inflammatory evidence is for
    EPA-rich marine oil; the KG models EPA+DHA as one active, so a vet should review any formula
    where this replaces fish oil.

# ---- joint ------------------------------------------------------------------
- id: rm:glucosamine_hcl_shellfish
  name: Glucosamine HCl (crustacean)
  physical_form: powder
  provides: [{ingredient: ingredient:glucosamine, fraction: 0.83}]
  derived_from: [allergen:shellfish]
  compatible_forms: &dry_heat_ok
    - {form: form:soft_chew_cold}
    - {form: form:soft_chew_extruded}
    - {form: form:chewable_tablet}
    - {form: form:capsule}
    - {form: form:sprinkle_capsule}
    - {form: form:powder_sachet}
  description: 83% glucosamine base (MW 179.2 / 215.6).
- id: rm:glucosamine_hcl_vegetarian
  name: Glucosamine HCl (corn fermentation)
  physical_form: powder
  provides: [{ingredient: ingredient:glucosamine, fraction: 0.83}]
  derived_from: [allergen:corn]
  preferred: true
  compatible_forms: *dry_heat_ok
- id: rm:chondroitin_sulfate_bovine
  name: Sodium chondroitin sulfate, bovine trachea, 90%
  physical_form: powder
  provides: [{ingredient: ingredient:chondroitin_sulfate, fraction: 0.90}]
  derived_from: [allergen:beef]
  moisture_sensitive: true
  preferred: true
  compatible_forms: *dry_heat_ok
