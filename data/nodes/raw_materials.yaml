- id: rm:chondroitin_sulfate_porcine
  name: Sodium chondroitin sulfate, porcine, 90%
  physical_form: powder
  provides: [{ingredient: ingredient:chondroitin_sulfate, fraction: 0.90}]
  derived_from: [allergen:pork]
  moisture_sensitive: true
  compatible_forms: *dry_heat_ok
- id: rm:green_lipped_mussel_powder
  name: Green-lipped mussel powder, freeze-dried (Perna canaliculus)
  physical_form: powder
  provides: [{ingredient: ingredient:green_lipped_mussel, fraction: 1.0}]
  derived_from: [allergen:shellfish]
