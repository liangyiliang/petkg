    - {form: form:chewable_tablet}
    - {form: form:soft_chew_cold, notes: cold process only}
    - {form: form:powder_sachet}
  description: Dosed as mg of the UC-II ingredient. 40 mg UC-II ~ 10 mg type II collagen ~ 1.2 mg undenatured.
  sources: [source:lugo_2016_uc2]
- id: rm:msm
  name: Methylsulfonylmethane, 99.9%
  physical_form: powder
  provides: [{ingredient: ingredient:msm, fraction: 0.999}]
  palatability: poor
  compatible_forms: *dry_heat_ok
- id: rm:curcumin_95
