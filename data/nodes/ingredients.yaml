# Ingredients = what doses and safety rules are written about.
#   kind: active     may be dosed in a formula (still subject to every safety edge)
#   kind: excipient  carrier / palatant / preservative; screened in products, never dosed
#   kind: hazard     never formulated; exists so screens can catch it in products and raw materials
# dose_unit is the unit every DoseRule / SafetyLimit / Product amount for this ingredient uses.

