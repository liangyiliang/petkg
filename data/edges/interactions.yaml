- ingredient: ingredient:sodium_chloride
  medication: med:potassium_bromide
  severity: major
  action: exclude
  mechanism: Bromide and chloride compete for renal reabsorption; raising dietary chloride from 0.2% to 1.3% DM
    cut bromide half-life from 69 to 24 days and required ~3x dose; a dog lost seizure control after a high-chloride
    diet change. Conversely abrupt chloride reduction can push bromide toward toxicity.
  evidence_strength: strong
  sources:
  - source:pmid_7659851
  - source:pmid_8567379
  - source:kbrovet_potassium_bromide_label_increased_dietary_consumptio
  curation:
    status: draft
    notes: evidence_level=controlled_study_target_species; strength=strong
