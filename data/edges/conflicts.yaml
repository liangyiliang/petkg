# Ingredient <-> ingredient blending / co-dosing issues (from the manufacturing research pass).
- {a: ingredient:copper, b: ingredient:zinc, kind: absorption_competition, action: vet_review,
   notes: "Zinc induces enterocyte metallothionein, which traps copper. Used on purpose in copper hepatopathy; chronic high zinc risks copper deficiency otherwise.",
   sources: [source:webster_2019_acvim_copper]}
- {a: ingredient:calcium_carbonate, b: ingredient:zinc, kind: absorption_competition, action: separate_units,
   notes: "Excess calcium (and phytate) binds zinc and lowers absorption.", sources: [source:gough_thomas_2018],
   curation: {status: draft, notes: "Source is the UMN zinc-responsive dermatosis chapter; add as its own source."}}
- {a: ingredient:iron, b: ingredient:omega3_epa_dha, kind: chemical_degradation, action: avoid_combination,
   notes: "Fe3+/Cu2+ catalyse fish-oil oxidation; keep mineral premixes out of the oil phase.", sources: [source:goed_monograph]}
- {a: ingredient:copper, b: ingredient:omega3_epa_dha, kind: chemical_degradation, action: avoid_combination,
