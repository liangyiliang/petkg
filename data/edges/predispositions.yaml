- breed: breed:labrador_retriever
  condition: condition:obesity
  strength: strong
  genetic_test: POMC deletion (Labrador)
  sources:
  - source:raffan_2016_pomc
  - source:gough_thomas_2018
  curation:
    status: draft
    notes: POMC 14-bp deletion, allele freq 12%; about 23% of Labradors carry >=1 copy; +1.9 kg per allele; linked to food
      motivation (Raffan E et al. Cell Metab 2016, doi:10.1016/j.cmet.2016.04.012). Obesity is among the most common disorders
      in UK Labradors (McGreevy PD et al. Canine Genet Epidemiol 2018, VetCompass) [verified_snippet]
