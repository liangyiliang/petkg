    notes: research pass 2026-10-03; PMIDs checked against PubMed for author/year
- ingredient: ingredient:chondroitin_sulfate
  need: need:joint_mobility
  species: species:dog
  grade: NEG
  effect: 'Same evidence base as glucosamine: the meta-analysis concludes chondroitin-glucosamine nutraceuticals have no analgesic
    effect in canine OA.'
  mechanism: 'Proposed: glycosaminoglycan substrate, inhibits MMPs and aggrecanases.'
  caveats: Evidence is almost entirely for the glucosamine+chondroitin combination; there is no good stand-alone chondroitin
