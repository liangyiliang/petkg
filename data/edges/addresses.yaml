- ingredient: ingredient:avocado_soybean_unsaponifiables
  need: need:joint_mobility
  species: species:dog
  grade: C
  effect: In the experimental ACL-transection dog model (placebo-controlled), ASU reduced macroscopic and histologic cartilage
    lesions and subchondral bone loss; there is no clinical pain trial in dogs with naturally occurring OA.
  mechanism: Inhibits iNOS and MMP-13; raises TGF-beta in joint fluid.
  caveats: Graded C (not B) because the evidence is structural, in an induced-OA model, with no clinical endpoint. The meta-analysis
    lists ASU among 'others' with an analgesic signal, but the specific trial was not identified (unverified). Commercial
    products combine ASU with Glu/CS.
