- ingredient: ingredient:chitosan_calcium_carbonate
  need: need:phosphate_management
  species: species:cat
  grade: C
  effect: In a small study, a chitosan + calcium carbonate supplement (Epakitin/Ipakitine type) lowered apparent phosphorus
    digestibility in healthy cats and lowered plasma phosphate and urea in 6 aged CKD cats over 35 days.
  mechanism: Calcium carbonate binds dietary phosphate in the gut; chitosan is proposed to adsorb uraemic toxins.
  caveats: A Brown SA et al. 2008 IJARVM study of Epakitin in cats with reduced renal function is widely cited but could not
    be found in PubMed or Crossref (unverified). Most of the phosphate-binding effect is probably from calcium carbonate;
    the incremental value of chitosan is not established.
  sources:
