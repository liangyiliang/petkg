- ingredient: ingredient:curcumin
  need: need:joint_mobility
  species: species:dog
  grade: B
  effect: Results are mixed. A turmeric extract (P54FP) RCT found no force-plate benefit but a positive investigator assessment;
    a curcuminoid/collagen/green-tea diet RCT reduced pain on manipulation but did not change ground reaction forces.
  mechanism: Inhibits NF-kB/COX-2 and lowers inflammatory cytokines; antioxidant.
  caveats: Poor oral bioavailability of native curcumin, so formulation matters. The Comblain trial tested a combination.
  sources:
