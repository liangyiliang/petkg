- ingredient: ingredient:cobalamin
  need: need:cobalamin_repletion
  species: species:dog
  grade: A
  effect: Randomised trials and retrospective data show that daily oral cyanocobalamin normalises serum cobalamin and lowers
    MMA in hypocobalaminaemic dogs with chronic enteropathy (and EPI), as effectively as injections.
  mechanism: High-dose oral B12 is absorbed by passive diffusion that does not depend on intrinsic factor or the ileal cubam
    receptor (~1% of dose).
  caveats: Efficacy is for repletion in deficient dogs only. The 'Toll 2010' and 'Kathrani/Berghoff oral cobalamin' papers
    named in the task could not be found; Berghoff's papers are on diagnosis (cobalamin/MMA), not oral therapy (e.g. PMID:23270350).
