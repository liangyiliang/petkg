- ingredient: ingredient:enterococcus_faecium_sf68
  need: need:gi_microbiome_stool_quality
  species: species:cat
  grade: B
  effect: In a blinded, placebo-controlled shelter crossover, cats fed SF68 had fewer diarrhoea episodes of 2 days or more
    (7.4% vs 20.7%). In lab cats on amoxicillin-clavulanate, SF68 lowered total diarrhoea scores but did not change microbiome
