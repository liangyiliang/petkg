# Ingredient -> HealthNeed per species, with species-specific evidence grade.
# NEG edges are kept on purpose: they stop the engine (and the LLM) recommending them.
- ingredient: ingredient:omega3_epa_dha
  need: need:joint_mobility
  species: species:dog
  grade: A
  effect: Several RCTs found improved force-plate peak vertical force, owner-rated mobility and veterinary lameness scores
    in dogs with OA given high-EPA/DHA diets or fish-oil supplements; meta-analysis shows clear analgesic efficacy.
  mechanism: EPA/DHA displace arachidonic acid in cell membranes, which lowers PGE2/LTB4 and inflammatory cytokines and raises
    pro-resolving mediators.
  caveats: Much of the evidence is for therapeutic diets (Hill's/Purina), which change several nutrients at once; diets and
    supplements are separate categories in the meta-analysis. The dose that works is high (roughly 50-100+ mg EPA+DHA/kg/day).
    Several trials are industry funded.
  sources:
  - source:pmid_36142319
  - source:pmid_22404506
  - source:pmid_27269707
  - source:pmid_20043801
  - source:pmid_20043800
  - source:pmid_22805303
  curation:
    status: draft
    notes: research pass 2026-10-03; PMIDs checked against PubMed for author/year
- ingredient: ingredient:omega3_epa_dha
  need: need:joint_mobility
  species: species:cat
  grade: B
  effect: Small controlled trials in cats with DJD found better owner-perceived locomotion (fish oil vs corn oil) and objectively
    measured activity (accelerometry) on a high-EPA/DHA diet.
  mechanism: Same eicosanoid/resolvin modulation as in dogs.
  caveats: Very few cats studied. The Lascelles diet also contained green-lipped mussel and glucosamine/chondroitin, so the
    effect cannot be credited to omega-3 alone.
  sources:
  - source:pmid_22882740
  - source:pmid_20337921
  - source:pmid_36142319
  curation:
    status: draft
    notes: research pass 2026-10-03; PMIDs checked against PubMed for author/year
- ingredient: ingredient:glucosamine
  need: need:joint_mobility
  species: species:dog
  grade: NEG
  effect: The meta-analysis found a 'very marked non-effect' of glucosamine/chondroitin on OA pain (88.9% of trials showed
    no effect). Placebo-controlled trials with objective outcomes (activity monitors, force plate) are negative.
  mechanism: 'Proposed: supplies substrate for cartilage glycosaminoglycans and has mild anti-catabolic effects (not shown
    clinically).'
  caveats: Almost all canine trials test glucosamine and chondroitin together, so the evidence is the same for both. Positive
    results come from trials that are subjective or have no placebo arm.
  sources:
  - source:pmid_36142319
  - source:pmid_28763523
  - source:pmid_21623931
  - source:pmid_16647870
  - source:pmid_28331832
