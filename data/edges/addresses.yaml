- ingredient: ingredient:multistrain_probiotic
  need: need:gi_mucosal_inflammation
  species: species:dog
  grade: B
  effect: In dogs with idiopathic IBD, the VSL#3 strains lowered clinical and histological scores and CD3+ infiltration and
    raised FoxP3+/TGF-beta+ regulatory cells (vs prednisone+metronidazole). Visbiome added to diet+prednisone upregulated
