- ingredient: ingredient:undenatured_collagen_type_ii
  need: need:joint_mobility
  species: species:dog
  grade: B
  effect: Several small trials found lower observational pain/lameness scores, and in one trial better force-plate values,
    with UC-II 10 mg/day. Two Italian RCTs found UC-II comparable to robenacoxib/cimicoxib on LOAD scores. The meta-analysis
    rates collagen efficacy as weak.
  mechanism: 'Oral tolerance: undenatured type II collagen epitopes induce gut-associated regulatory T-cells that dampen immune
    reactions against joint cartilage.'
  caveats: Gupta/Bagchi trials are tiny, come from one group and have commercial ties. Non-inferiority trials without placebo
    cannot separate the effect from natural recovery or placebo. The 2024 Stabile trial (PMID:39475935) tested UC-II plus
    Boswellia.
