- ingredient: ingredient:multistrain_probiotic
  need: need:gi_microbiome_stool_quality
  species: species:dog
  grade: B
  effect: In a placebo-controlled RCT of acute haemorrhagic diarrhoea syndrome, a multistrain probiotic sped normalisation
