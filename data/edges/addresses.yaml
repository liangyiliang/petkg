- ingredient: ingredient:omega3_epa_dha
  need: need:skin_coat_barrier
  species: species:dog
  grade: B
  effect: Several double-blind RCTs in atopic/pruritic dogs found less pruritus, alopecia and better coat with marine oil,
    improved clinical scores, and a steroid-sparing effect after about 2 months.
  mechanism: Anti-inflammatory eicosanoid shift; incorporation into epidermal lipids that support barrier function.
  caveats: Benefit is modest and slow (6-12 weeks). Guidelines support EFA as adjunctive care for skin and coat, not as an
    anti-pruritic monotherapy. The Mueller 2004 product also contained omega-6, and flax (ALA) worked as well, so the effect
    is not specific to EPA/DHA.
