- ingredient: ingredient:green_lipped_mussel
  need: need:joint_mobility
  species: species:dog
  grade: B
  effect: Several placebo-controlled trials found improved owner and veterinary mobility/pain scores (some with force-plate
    outcomes) in dogs with OA given green-lipped mussel (GLM) powder or extract; results vary between trials.
  mechanism: Supplies omega-3 fatty acids (incl. ETA) and furan fatty acids that inhibit COX/LOX; also contains glycosaminoglycans.
  caveats: 'Product-specific: extraction and stabilisation change potency. Effects are slower and smaller than NSAIDs. Vandeweerd
    2012 rated the evidence low. Grade A was not given because results are inconsistent and some trials are industry-linked.'
  sources:
  - source:pmid_18955269
