- ingredient: ingredient:omega3_epa_dha
  target: condition:pancreatitis_history
  species:
  - species:dog
  - species:cat
  severity: relative
  action: vet_review
  rationale: Fish oil adds long-chain fat; high-fat intake is the usual dietary concern in pancreatitis-prone dogs.
    Lenox & Bauer list GI adverse effects; no study shows fish oil causes pancreatitis in dogs/cats.
  evidence_strength: weak
  sources:
  - source:pmid_23323770
  curation:
    status: draft
    notes: evidence_level=mechanistic_theoretical; strength=weak; Count fish oil toward the total dietary fat budget;
      prefer concentrated EPA/DHA (less total fat per mg).
- ingredient: ingredient:omega3_epa_dha
  target: condition:bleeding_disorder
  species:
  - species:dog
  - species:cat
  severity: relative
  action: vet_review
  rationale: Altered platelet function is a listed potential adverse effect. In cats, high-dose purified EPA/DHA
    for 2 months did not change bleeding time or platelet aggregation. Human perioperative RCT (8-10 g EPA+DHA)
    showed no excess bleeding.
  evidence_strength: weak
  sources:
  - source:pmid_23323770
  - source:pmid_7983618
  - source:pmid_9868228
  - source:pmid_30571332
  curation:
    status: draft
    notes: evidence_level=controlled_study_target_species; strength=weak; Saker 1998 did report altered platelet
      function with diet n-6:n-3 manipulation (abstract not read; direction/magnitude unverified).
