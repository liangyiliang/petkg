# DoseRule: daily amount of one ingredient for one species, optionally for one need.
# Engine: for each need an ingredient serves, use the need-specific rule if present, else the
# general rule (need omitted); take the highest target, then clip to SafetyLimits.
# basis: per_kg (x BW), per_kg_0.75 (x BW^0.75), per_animal (fixed), weight_band (lookup).
# curation.notes says whether a number is verified, derived, or a Freyja choice within a range.

# ================================ DOG =================================================
- id: dose:omega3_dog_general
  ingredient: ingredient:omega3_epa_dha
  species: species:dog
  basis: per_kg
  unit: mg
  min: 50
  target: 100
  max: 220
  sources: [source:pmid_23323770, source:pmid_22087720]
  curation: {status: draft, notes: "Bauer 50-220 mg EPA+DHA/kg/day (verified_secondary). Target 100 is a Freyja midpoint choice."}
