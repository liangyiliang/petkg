# research_safety.yaml
# Safety facts for a veterinary supplement knowledge graph (dogs, cats).
# Generated 2026-10-03 by a research agent. Every PMID/DOI listed with
# verified: true was looked up this session (NCBI E-utilities esummary/efetch)
# and its title, authors and year matched. Label/regulatory citations marked
# verified: true were read from DailyMed SPL XML, eCFR mirror (LII), the NOAH
# compendium or the Merck Veterinary Manual online. Anything that rests only on
# secondary or consumer sources, or that is my own mechanistic inference, is
# marked verified: false and/or evidence_level: mechanistic_theoretical.
#
# Conventions
#   evidence_level (strongest first):
#     regulatory            - law/regulation or approved drug label
#     consensus_guideline   - ACVIM / IRIS consensus statement
#     controlled_study_target_species
#     case_series_target_species  (e.g. ASPCA APCC retrospective series)
#     case_report_target_species
#     reference_text        - Merck Veterinary Manual etc.
#     extrapolated_human    - human RCT/cohort/label, no pet data
#     mechanistic_theoretical - plausible mechanism, no clinical data
#   species: dog | cat | both
#   filter_action (species toxicity): exclude | dose_cap | vet_review | none
#   condition action: exclude | reduce_dose | vet_review | monitor
#   interaction action: avoid | separate_dosing_by_hours=N | monitor | reduce_dose
#   1 IU vitamin D3 = 0.025 ug cholecalciferol (so 0.1 mg/kg = 4,000 IU/kg).

meta:
  version: 1
  generated: "2026-10-03"
  scope: [dog, cat]
  caveats:
    - "Thresholds are ingestion thresholds for acute toxicosis unless stated; they are NOT safe daily supplement doses. A deterministic filter should exclude well below them."
    - "Merck Veterinary Manual pages are revised; two current Merck pages give different iron and vitamin D numbers (recorded below)."
    - "Where only human evidence exists the entry says so (evidence_level: extrapolated_human)."

# ---------------------------------------------------------------------------
# 1) SPECIES TOXICITY
# ---------------------------------------------------------------------------
species_toxicity:

  - id: xylitol__dog
    ingredient: xylitol
    species: dog
    filter_action: exclude
    toxic_dose:
      - {effect: hypoglycemia, threshold_mg_per_kg: 100, qualifier: ">", source: merck_xylitol}
      - {effect: hepatic_failure, threshold_mg_per_kg: 500, qualifier: ">", source: merck_xylitol}
    clinical_signs: [vomiting, weakness, ataxia, lethargy, seizures, coma, hypoglycemia, acute_hepatic_necrosis, coagulopathy]
    onset: "within 30 min, may be delayed 12-18 h (sustained-release products); hepatic failure 24-72 h"
    mechanism: "Potent insulin release in dogs; hepatocellular necrosis mechanism unclear."
    evidence_level: case_series_target_species
    citations:
      - {ref: "Merck Veterinary Manual - Xylitol Toxicosis in Dogs", url: "https://www.merckvetmanual.com/toxicology/food-hazards/xylitol-toxicosis-in-dogs", verified: true}
      - {pmid: "17014359", doi: "10.2460/javma.229.7.1113", ref: "Dunayer EK, Gwaltney-Brant SM. Acute hepatic failure and coagulopathy associated with xylitol ingestion in eight dogs. JAVMA 2006;229:1113-7", verified: true}
      - {pmid: "15080212", ref: "Dunayer EK. Hypoglycemia following canine ingestion of xylitol-containing gum. Vet Hum Toxicol 2004;46:87-8", verified: true}
      - {pmid: "26220654", doi: "10.1111/vec.12350", ref: "DuHadway MR et al. Retrospective evaluation of xylitol ingestion in dogs: 192 cases (2007-2012). JVECC 2015;25:646-54", verified: true}
      - {pmid: "30064708", doi: "10.1016/j.cvsm.2018.06.004", ref: "Murphy LA, Dunayer EK. Xylitol Toxicosis in Dogs: An Update. Vet Clin Small Anim 2018;48:985-990", verified: true}
    notes: "Common hidden excipient in human chewables/melatonin/gummies and some peanut butters (VCA melatonin page warns human products may contain xylitol). Filter should also flag 'birch sugar'."

  - id: xylitol__cat
    ingredient: xylitol
    species: cat
    filter_action: vet_review
    toxic_dose: []
    clinical_signs: []
    evidence_level: controlled_study_target_species
    citations:
      - {pmid: "29430681", doi: "10.1111/jvp.12479", ref: "Jerzsele A et al. Effects of p.o. administered xylitol in cats. J Vet Pharmacol Ther 2018;41:409-414", verified: true}
      - {ref: "Merck Veterinary Manual - Xylitol Toxicosis in Dogs (states cats are not at risk for hypoglycemia or liver injury)", verified: true}
    notes: "6 healthy cats given 100, 500, 1000 mg/kg showed no hematologic/biochemical change. Small n; not proof of safety. Keep out of cat formulas by default (no benefit), but not a hard species toxin."

  - id: alpha_lipoic_acid__cat
    ingredient: alpha_lipoic_acid
    species: cat
    filter_action: exclude
    toxic_dose:
      - {effect: hepatocellular_toxicity_and_clinical_toxicity, threshold_mg_per_kg: 60, qualifier: "toxic in all cats at", source: hill_2004}
      - {effect: maximum_tolerated_dose, threshold_mg_per_kg: 30, qualifier: "MTD <", source: hill_2004}
    clinical_signs: [hypersalivation_or_vomiting_unverified, lethargy, ataxia_unverified, hepatocellular_injury, hyperammonemia, altered_plasma_amino_acids]
    mechanism: "Hepatocellular toxicity; precise mechanism not established in the paper (do not attribute solely to glucuronidation deficiency)."
    evidence_level: controlled_study_target_species
    citations:
      - {pmid: "15059240", doi: "10.1111/j.1439-0396.2003.00472.x", ref: "Hill AS, Werner JA, Rogers QR, O'Neill SL, Christopher MM. Lipoic acid is 10 times more toxic in cats than reported in humans, dogs or rats. J Anim Physiol Anim Nutr 2004;88:150-6", verified: true}
    notes: "Abstract confirms: 60 mg/kg = significant clinical toxicity with ammonia and amino acid changes in all high-dose cats; MTD <30 mg/kg. Specific clinical sign list beyond that is not in the abstract (marked _unverified)."

  - id: alpha_lipoic_acid__dog
    ingredient: alpha_lipoic_acid
    species: dog
