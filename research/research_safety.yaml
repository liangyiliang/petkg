# ---------------------------------------------------------------------------
# Index of items resting on weak / unverified evidence (for the reviewer)
# ---------------------------------------------------------------------------
weak_or_unverified_index:
  species_toxicity:
    - "nutmeg (dog): threshold from consumer pages only; no PubMed source"
    - "yohimbe (dog/cat): mechanistic only"
    - "kava (dog/cat): human hepatotoxicity only"
    - "salicylate/white willow bark (cat): half-life and toxic dose from secondary web summaries; no willow-in-cat study"
    - "methylxanthines (cat): cat lethal range from secondary site"
    - "iron: old 20/60 mg/kg tiers from dvm360 snippet; current Merck says >50/>80 mg/kg"
    - "vitamin D3 (cat): no cat-specific acute threshold; cats resistant to chronic intake in Sih 2001"
    - "grape/raisin (cat): anecdotal only; grape seed extract tartaric acid content unknown"
    - "benzoic acid (cat): dose/signs not verified (no abstract)"
    - "feline glucuronidation 'theoretical_caution' polyphenols list (curcumin, EGCG, resveratrol, quercetin, silymarin, menthol): inference"
    - "5-HTP (cat) and hops (cat): extrapolated from dog data"
  condition_contraindications:
    - "omega-3 in pancreatitis history: no causal data"
    - "omega-3 in bleeding/surgery: cat study and human RCT show no effect; weak"
    - "glucosamine in diabetes: one 21-day healthy-dog study, null"
    - "glucosamine/chitosan in shellfish allergy: human tolerance data only"
    - "krill oil in shellfish allergy: mechanistic"
    - "vitamin C in CaOx: human cohort only"
    - "cranberry in CaOx: conflicting human data"
    - "melatonin in diabetes: only secondary statement attributed to Plumb's"
    - "MCT in pancreatitis: healthy-dog marker studies, null"
    - "probiotics in immunosuppressed/critically ill: human data"
    - "vitamin E high dose and coagulation: human data"
    - "turmeric/curcumin with biliary obstruction and anticoagulants: human/rat data"
    - "ginkgo in epilepsy: no verified citation"
    - "IRIS calcium binder / phosphate statements: IRIS PDF text not extracted; secondary summaries"
    - "adverse food reaction excipient rule: no citation"
  drug_interactions:
    - "omega-3 + NSAID/antiplatelet: evidence for harm weak; benefit (carprofen dose reduction) shown"
    - "probiotic-antibiotic separation interval: RCTs used 1 h; 2 h is convention, not tested"
    - "fluoroquinolone 2 h separation: labels say avoid concomitant use; interval from practice sources"
    - "serotonergic supplements + SSRIs/TCAs/tramadol/selegiline: label restrictions are for drugs; supplements extrapolated"
    - "iodine + methimazole/levothyroxine: mechanistic"
    - "cinnamon + insulin, licorice + steroids/furosemide, SJW + phenobarbital, hawthorn + pimobendan: mechanistic/human"
    - "antioxidants + chemotherapy: human review, controversial"
    - "milk thistle CYP: consensus caution, no dog PK data"
    - "magnesium supplements + gabapentin: extrapolated from Maalox label data"
