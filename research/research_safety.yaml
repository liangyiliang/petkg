  - id: calcium_binders__chronic_kidney_disease
    ingredient: calcium_containing_phosphate_binders
    condition: chronic_kidney_disease
    species: both
    severity: relative
    action: monitor
    rationale: "Useful for hyperphosphatemia but can promote hypercalcaemia; recheck phosphate and calcium every 4-6 weeks until stable."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
