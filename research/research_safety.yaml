      - {pmid: "11843115", doi: "10.2460/ajvr.2002.63.181", ref: "Court MH, Freeman LM. Identification and concentration of soy isoflavones in commercial cat foods. Am J Vet Res 2002", verified: true}
    notes: "Also confounds thyroid testing."

  # ---- reproduction -----------------------------------------------------------
  - id: herbals_vitamin_a__pregnancy_lactation
    ingredient: [vitamin_a_high_dose, kava, yohimbe, st_johns_wort, essential_oils, 5_htp, melatonin, propylene_glycol_cat]
    condition: pregnancy_lactation
    species: both
    severity: relative
    action: exclude
    rationale: "Vitamin A excess is teratogenic (general); no reproductive safety data for listed herbals; propylene glycol risk highest in lactating queens/nursing kittens (Christopher 1989); VCA lists melatonin as use-with-caution in pregnant/nursing/breeding pets."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "2708106", ref: "Christopher 1989 (propylene glycol)", verified: true}
      - {ref: "VCA Animal Hospitals - Melatonin monograph", url: "https://vcahospitals.com/know-your-pet/melatonin", verified: true}

  # ---- allergy / GI -------------------------------------------------------------
  - id: animal_protein_excipients__adverse_food_reaction
    ingredient: [flavored_chewable_bases_pork_liver_chicken_beef, gelatin, collagen, chicken_cartilage, egg_membrane, fish_protein, dairy_colostrum, whey]
    condition: adverse_food_reaction
    species: both
    severity: relative
    action: vet_review
    rationale: "Intact protein sources can break an elimination diet trial; choose supplements whose protein sources match the elimination diet or are hydrolysed/protein-free."
    evidence_level: mechanistic_theoretical
    evidence_strength: moderate
    citations: []
    notes: "No specific citation verified this session (ICADA/Olivry papers not retrieved)."

  - id: animal_protein_excipients__atopic_dermatitis
    ingredient: [flavored_chewable_bases, beef_gelatin, chicken_cartilage]
    condition: atopic_dermatitis
    species: dog
    severity: relative
    action: monitor
    rationale: "Food-induced flares overlap with atopic dermatitis in many dogs; same logic as adverse_food_reaction."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []

  - id: fish_oil_high_dose__chronic_enteropathy
    ingredient: omega3_fish_oil_high_dose
    condition: chronic_enteropathy
    species: both
    severity: relative
    action: reduce_dose
    rationale: "GI adverse effects (diarrhea, vomiting) are listed for fish oil; titrate up. For protein-losing enteropathy/lymphangiectasia, long-chain fat load matters (new ID protein_losing_enteropathy)."
    evidence_level: reference_text
    evidence_strength: weak
    citations:
      - {pmid: "23323770", ref: "Lenox & Bauer 2013", verified: true}

  - id: cranberry__recurrent_uti
    ingredient: cranberry_extract
    condition: recurrent_uti
    species: both
    severity: none
    action: monitor
    rationale: "NOT unsafe, but efficacy unproven: systematic review (3 studies, 106 dogs, 16 cats) found no significant effect; certainty low/very low. Should not replace culture-guided therapy."
    evidence_level: controlled_study_target_species
    evidence_strength: moderate
    citations:
      - {pmid: "41676867", doi: "10.1111/jvp.70050", ref: "Weese JS, Weese HE. Effectiveness of cranberry supplementation for prevention and treatment of infectious urinary tract disease in dogs and cats: a systematic review. J Vet Pharmacol Ther 2026;49:102-109", verified: true}
      - {pmid: "27914106", doi: "10.1111/jvim.14613", ref: "Olby NJ et al. Effect of cranberry extract on the frequency of bacteriuria in dogs with acute thoracolumbar disk herniation: RCT. JVIM 2017", verified: true}

  # ---- explicitly-checked "generally safe" items --------------------------------
  - id: l_theanine__general
    ingredient: l_theanine
    condition: any
    species: both
    severity: none
    action: monitor
    rationale: "No contraindications identified; open-label cat field study without safety concerns reported in abstract title context. Evidence base small."
    evidence_level: case_series_target_species
    evidence_strength: weak
    citations:
      - {pmid: "30338056", doi: "10.1186/s13620-018-0130-4", ref: "Dramard V et al. Effect of l-theanine tablets in reducing stress-related emotional signs in cats: an open-label field study. Ir Vet J 2018;71:21", verified: true}

  - id: tryptophan__general
    ingredient: l_tryptophan
    condition: any
    species: both
    severity: none
    action: monitor
    rationale: "Generally safe at dietary-supplement doses; tested in dog behavior trials. Main risk is additive serotonergic effect with drugs (see interactions)."
    evidence_level: controlled_study_target_species
    evidence_strength: weak
    citations:
      - {pmid: "10953712", doi: "10.2460/javma.2000.217.504", ref: "DeNapoli JS et al. Effect of dietary protein content and tryptophan supplementation on dominance aggression, territorial aggression, and hyperactivity in dogs. JAVMA 2000;217:504-8", verified: true}

# ---------------------------------------------------------------------------
# 3) DRUG-SUPPLEMENT INTERACTIONS
# ---------------------------------------------------------------------------
# New drug IDs introduced: d_penicillamine, digoxin (mentioned only), warfarin
# (subsumed in antiplatelet_anticoagulant), allopurinol, amitraz (MAOI, topical).
drug_interactions:

  # ---- NSAIDs / antiplatelets ------------------------------------------------
  - id: omega3__nsaid
    ingredient: omega3_fish_oil
    drug: nsaid
    drug_examples: [carprofen, meloxicam, deracoxib, grapiprant]
    mechanism: "Additive anti-inflammatory effect (EPA/DHA eicosanoid shift); theoretical additive platelet/GI-bleeding effect."
    severity: minor
    action: monitor
    evidence_level: controlled_study_target_species
    evidence_strength: weak_for_harm
    citations:
      - {pmid: "20187817", doi: "10.2460/javma.236.5.535", ref: "Fritsch DA et al. A multicenter study of the effect of dietary supplementation with fish oil omega-3 fatty acids on carprofen dosage in dogs with osteoarthritis. JAVMA 2010;236:535-9", verified: true}
      - {pmid: "23323770", ref: "Lenox & Bauer 2013 (lists nutrient-drug interactions)", verified: true}
      - {ref: "Raditic D, Gaylord L. Today's Veterinary Practice 2020 - speculative association of NSAIDs + omega-3 and/or glucosamine with chronic blood loss", verified: true}
    notes: "Evidence of harm is weak (speculation/case-level); evidence of benefit (NSAID dose reduction) exists. Answer to caller: the bleeding-risk evidence is weak."

  - id: omega3__antiplatelet_anticoagulant
    ingredient: omega3_fish_oil_high_dose
    drug: antiplatelet_anticoagulant
    drug_examples: [clopidogrel, aspirin, rivaroxaban]
    mechanism: "Possible additive platelet inhibition."
    severity: minor
    action: monitor
    evidence_level: controlled_study_target_species
    evidence_strength: weak
    citations:
      - {pmid: "7983618", ref: "Bright 1994 - no change in bleeding time/aggregation in cats on high-dose EPA/DHA", verified: true}
      - {pmid: "30571332", ref: "Akintoye 2018 human RCT - no excess bleeding", verified: true}
    notes: "No dog/cat study of fish oil + clopidogrel/rivaroxaban found."

  - id: salicylate_herbs__nsaid
    ingredient: [white_willow_bark, meadowsweet, wintergreen]
    drug: nsaid
    mechanism: "Salicylate is itself a COX inhibitor -> additive GI ulceration and renal risk; NSAID labels prohibit combining NSAIDs/aspirin."
    severity: major
    action: avoid
    evidence_level: mechanistic_theoretical
    evidence_strength: moderate
    citations: []
    notes: "Mechanistic; NSAID label language not retrieved this session."

  - id: salicylate_herbs__glucocorticoid
    ingredient: white_willow_bark
    drug: glucocorticoid
    mechanism: "Additive GI ulceration risk (NSAID + steroid analogue)."
    severity: moderate
    action: avoid
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []

  - id: vitamin_e__antiplatelet_anticoagulant
    ingredient: vitamin_e_high_dose
    drug: antiplatelet_anticoagulant
    mechanism: "Vitamin E metabolites antagonize vitamin K; human warfarin potentiation reports."
    severity: moderate
    action: monitor
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "25225959", ref: "Podszun & Frank 2014", verified: true}

  - id: curcumin__antiplatelet_anticoagulant
    ingredient: turmeric_curcumin
    drug: antiplatelet_anticoagulant
    mechanism: "In vitro antiplatelet; altered warfarin/clopidogrel PK in rats without change in anticoagulation/aggregation."
    severity: minor
    action: monitor
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "23807811", ref: "Liu 2013 Planta Med (rat)", verified: true}

  - id: ginkgo_garlic_ginger__antiplatelet_anticoagulant
    ingredient: [ginkgo, garlic, ginger_high_dose]
    drug: antiplatelet_anticoagulant
    mechanism: "Antiplatelet constituents (human data)."
    severity: moderate
    action: avoid
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "38613937", ref: "Elvir Lazo 2024 perioperative herbal interactions review", verified: true}

  - id: melatonin__antiplatelet_anticoagulant
    ingredient: melatonin
    drug: antiplatelet_anticoagulant
    mechanism: "VCA monograph lists warfarin as caution; oral melatonin did not change platelet parameters in healthy dogs."
    severity: minor
    action: monitor
    evidence_level: controlled_study_target_species
    evidence_strength: weak
    citations:
      - {ref: "VCA melatonin monograph", verified: true}
      - {pmid: "31433224", ref: "Chen & Stone 2019 JAAHA", verified: true}

  # ---- antibiotics / chelation ------------------------------------------------
  - id: probiotics__antibiotics_general
    ingredient: [probiotics_live_bacteria, synbiotics]
    drug: antibiotics_general
    mechanism: "Antibiotic kills co-administered bacterial probiotic organisms in the gut lumen (yeast probiotics like S. boulardii are not affected by antibacterials)."
    severity: minor
    action: separate_dosing_by_hours=1
    action_note: "Canine/feline RCTs gave the synbiotic 1 h after the antibiotic and reduced antibiotic-associated GI signs; product labels (e.g., Proviable) and common practice say 1-2 h; use 2 h as the conservative default."
    recommended_default: separate_dosing_by_hours=2
    evidence_level: controlled_study_target_species
    evidence_strength: moderate_for_benefit_weak_for_timing
    citations:
      - {pmid: "31268578", doi: "10.1111/jvim.15553", ref: "Whittemore JC et al. Randomized, controlled, crossover trial of prevention of antibiotic-induced GI signs using a synbiotic mixture in healthy research dogs. JVIM 2019;33:1619-1626 (synbiotic 1 h after enrofloxacin/metronidazole)", verified: true}
      - {pmid: "28755457", doi: "10.1111/jvim.14795", ref: "Stokes JE et al. Prevention of clindamycin-induced GI signs using a synbiotic in healthy research cats. JVIM 2017;31:1406-1413 (synbiotic 1 h after clindamycin)", verified: true}
      - {ref: "Proviable-Forte product page (separate 1-2 h)", url: "https://shop.banfield.com/proviable-forte-capsules.html", verified: false}
    notes: "No study compared different separation intervals; timing is pragmatic."

  - id: multivalent_cations__fluoroquinolone
    ingredient: [calcium, magnesium, aluminum, iron, zinc, sucralfate, antacids, mineral_supplements, calcium_containing_phosphate_binders, chitosan_calcium_binders, dairy_colostrum_unverified]
    drug: fluoroquinolone
    drug_examples: [enrofloxacin, marbofloxacin, pradofloxacin_unverified, ciprofloxacin]
    mechanism: "Chelation of quinolone by di/trivalent cations reduces oral bioavailability."
    severity: major
    action: separate_dosing_by_hours=2
    action_note: "Zeniquin label: 'concomitant oral administration ... should be avoided'. Baytril label: metal cations may reduce absorption. 2 h separation is the commonly cited practice (vet pharmacy sources) - if dosing cannot be separated, avoid."
    evidence_level: regulatory
    evidence_strength: strong
    citations:
      - {ref: "ZENIQUIN (marbofloxacin) tablets label, Zoetis - DailyMed setid 05196313-2371-45ad-a6fb-6269f8ef94c5: 'Compounds (e.g., sucralfate, antacids, and mineral supplements) containing divalent and trivalent cations (e.g., iron, aluminum, calcium, magnesium, and zinc) can interfere with the absorption of quinolones ... concomitant oral administration ... should be avoided.'", verified: true}
      - {ref: "BAYTRIL (enrofloxacin) Taste Tabs label, Elanco - DailyMed setid 606b1dd3-24ed-4f8c-8885-6b22fd7b8883: 'Compounds that contain metal cations (e.g., aluminum, calcium, iron, magnesium) may reduce the absorption of some quinolone-class drugs'", verified: true}
    notes: "Chitosan itself is not a cation; risk comes from calcium carbonate in chitosan-based binder products."

  - id: multivalent_cations__tetracycline_doxycycline
    ingredient: [calcium, magnesium, aluminum, iron, zinc, antacids, oral_absorbents_kaolin_activated_charcoal, calcium_containing_phosphate_binders]
    drug: tetracycline_doxycycline
    mechanism: "Chelation reduces doxycycline availability."
    severity: major
    action: separate_dosing_by_hours=3
    action_note: "Doxybactin SPC (UK, dogs/cats): multivalent cations such as antacids and iron salts should not be used from 3 hours before to 3 hours after doxycycline."
    evidence_level: regulatory
    evidence_strength: strong
    citations:
      - {ref: "Doxybactin Tablets (doxycycline) SPC, NOAH Compendium (UK) - '...should not be used from 3 hours before to 3 hours after the administration of doxycycline.'", url: "https://www.noahcompendium.co.uk/?id=-469614", verified: true}

  - id: multivalent_cations__levothyroxine
    ingredient: [calcium_carbonate, iron_ferrous_sulfate, phosphate_binders, soy_unverified, high_fibre_unverified]
    drug: levothyroxine
    mechanism: "Binding/chelation in the gut reduces levothyroxine absorption."
    severity: moderate
    action: separate_dosing_by_hours=4
    action_note: "Human levothyroxine label: administer at least 4 h apart from phosphate binders (calcium carbonate, ferrous sulfate, sevelamer, lanthanum). No veterinary-specific interval found."
    evidence_level: extrapolated_human
    evidence_strength: moderate
    citations:
      - {ref: "Levothyroxine sodium tablets label (DailyMed setid 31a31756-68aa-4e01-bbb1-9d181f8d9181), section 7.1", verified: true}
      - {pmid: "28153426", doi: "10.1016/j.clinthera.2017.01.005", ref: "Skelin M et al. Factors affecting gastrointestinal absorption of levothyroxine: a review. Clin Ther 2017;39:378-403", verified: true}

  - id: antacid_mg_al__gabapentin
    ingredient: [magnesium_hydroxide, aluminum_hydroxide, magnesium_supplements_unverified]
    drug: gabapentin
    mechanism: "Mg/Al antacid reduced gabapentin bioavailability ~20% (~10% when gabapentin given 2 h after antacid)."
    severity: minor
    action: separate_dosing_by_hours=2
    evidence_level: extrapolated_human
    evidence_strength: moderate
    citations:
      - {ref: "NEURONTIN (gabapentin) label, section 7.3 - 'It is recommended that gabapentin be taken at least 2 hours following Maalox administration' (DailyMed setid 97935fd9-1d4a-43b6-a5d9-de994591187b)", verified: true}
    notes: "Extrapolation of magnesium supplements from Maalox data is unverified."

  - id: zinc__d_penicillamine
    ingredient: zinc
    drug: d_penicillamine
    new_drug_id: true
    mechanism: "Zinc and penicillamine interfere (co-treatment listed as contraindicated in ACVIM table); zinc is used only after chelation completes."
    severity: major
    action: avoid
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "30844094", ref: "ACVIM 2019 chronic hepatitis consensus, D-penicillamine table: 'Co-treatment with zinc contraindicated'", verified: true}

  # ---- serotonergic / MAOI ---------------------------------------------------
  - id: serotonergic_supplements__serotonergic_drugs
    ingredient: [5_htp, l_tryptophan_high_dose, st_johns_wort, same_s_adenosylmethionine]
    drug: serotonergic_drugs
    drug_examples: [fluoxetine, clomipramine, trazodone]
    mechanism: "Additive serotonergic activity -> serotonin syndrome (agitation, tremors, hyperthermia, seizures)."
    severity_by_ingredient:
      5_htp: {severity: major, action: avoid}
      st_johns_wort: {severity: major, action: avoid}
      same_s_adenosylmethionine: {severity: moderate, action: monitor}
      l_tryptophan_high_dose: {severity: moderate, action: monitor}
    evidence_level: extrapolated_human
    evidence_strength: weak_to_moderate
    citations:
      - {pmid: "10863592", ref: "Gwaltney-Brant 2000 - 5-HTP alone causes serotonin-syndrome-like toxicosis in dogs", verified: true}
      - {pmid: "23796482", doi: "10.1053/j.tcam.2013.03.003", ref: "Fitzgerald KT, Bronstein AC. Selective serotonin reuptake inhibitor exposure. Top Companion Anim Med 2013", verified: true}
    notes: "No dog/cat case of supplement+SSRI serotonin syndrome found; SAMe serotonergic interaction is human-pharmacology based. Tryptophan at dietary-level doses is low risk."

  - id: serotonergic_supplements__tramadol
    ingredient: [5_htp, l_tryptophan_high_dose, st_johns_wort, same_s_adenosylmethionine]
    drug: tramadol
    mechanism: "Tramadol inhibits serotonin reuptake; additive serotonin syndrome risk."
    severity: major
    action: avoid
    evidence_level: case_report_target_species
    evidence_strength: weak
    citations:
      - {pmid: "24966282", doi: "10.1177/1098612X14539088", ref: "Indrawirawan Y, McAlees T. Tramadol toxicity in a cat: case report and literature review of serotonin syndrome. JFMS 2014;16:572-8", verified: true}
    notes: "Severity major applied to 5-HTP and SJW; tryptophan/SAMe moderate+monitor (same split as above)."

  - id: serotonergic_supplements__selegiline
    ingredient: [5_htp, l_tryptophan, st_johns_wort, same_s_adenosylmethionine, tyramine_rich_ingredients_aged_cheese_yeast_extract_unverified]
    drug: selegiline
    mechanism: "Selegiline is an MAO-B inhibitor; fluoxetine and clomipramine labels prohibit combination and require a 14-day washout. Precursor/serotonergic supplements carry the same theoretical risk. Tyramine 'cheese reaction' rare at selective doses (human label)."
    severity: major
    action: avoid
    evidence_level: regulatory
    evidence_strength: moderate
    citations:
      - {ref: "RECONCILE (fluoxetine) chewable tablets label - 'should not be given in combination with a monoamine oxidase inhibitor (MAOI) [e.g., selegiline hydrochloride (L-deprenyl) or amitraz], or within a minimum of 14 days...' (DailyMed setid 006035a8-b8da-47cb-924b-524c05da8641)", verified: true}
      - {ref: "CLOMICALM (clomipramine) label - same MAOI restriction (DailyMed setid bed54123-2083-465f-97f3-0a796f2a37c7)", verified: true}
      - {ref: "Selegiline HCl human label (tyramine/hypertensive reactions; DailyMed setid 1924db3d-6a16-4496-cfd0-6903be146925)", verified: true}
    notes: "Labels address drug-drug, not supplements; supplement extension is mechanistic. Relevant to cognitive_dysfunction patients on selegiline. Amitraz (MAOI in tick collars/dips) belongs in the same group."

  # ---- anticonvulsants -----------------------------------------------------------
  - id: chloride_salt__potassium_bromide
    ingredient: [sodium_chloride_salt, potassium_chloride, high_chloride_supplements, electrolyte_powders]
    drug: potassium_bromide
    mechanism: "Bromide and chloride compete for renal reabsorption; raising dietary chloride from 0.2% to 1.3% DM cut bromide half-life from 69 to 24 days and required ~3x dose; a dog lost seizure control after a high-chloride diet change. Conversely abrupt chloride reduction can push bromide toward toxicity."
    severity: major
    action: avoid
    action_note: "Avoid starting/stopping chloride-containing supplements; if unavoidable keep chloride intake constant and monitor serum bromide."
    evidence_level: controlled_study_target_species
    evidence_strength: strong
    citations:
      - {pmid: "7659851", doi: "10.1016/0034-5288(95)90112-4", ref: "Trepanier LA, Babish JG. Effect of dietary chloride content on the elimination of bromide by dogs. Res Vet Sci 1995;58:252-5", verified: true}
      - {pmid: "8567379", ref: "Shaw N et al. High dietary chloride content associated with loss of therapeutic serum bromide concentrations in an epileptic dog. JAVMA 1996;208:234-6", verified: true}
      - {ref: "KBROVET (potassium bromide) label - 'Increased dietary consumption of chloride can promote loss of bromide in the urine...' (DailyMed setid 70e3e339-ba69-4439-9c93-c8193fd507c9)", verified: true}

  - id: st_johns_wort__phenobarbital
    ingredient: st_johns_wort
    drug: phenobarbital
    mechanism: "Both are enzyme inducers; unpredictable effects on co-medications; no dog data."
    severity: moderate
    action: avoid
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []

  - id: sedative_herbs__phenobarbital
    ingredient: [kava, valerian, melatonin, hops]
    drug: phenobarbital
    mechanism: "Additive CNS depression (mechanistic). Kava and hops are excluded anyway."
    severity: minor
    action: monitor
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {ref: "VCA melatonin monograph - caution with benzodiazepines (other CNS depressants)", verified: true}

  # ---- endocrine ---------------------------------------------------------------
  - id: chromium__insulin
    ingredient: chromium_picolinate
    drug: insulin
    mechanism: "Proposed insulin-sensitizing effect. Dogs: 20-60 ug/kg/d produced no beneficial or harmful glycemic effect. Cats: small dose-dependent improvement in glucose tolerance in healthy cats."
    severity: minor
    action: monitor
    evidence_level: controlled_study_target_species
    evidence_strength: moderate
    citations:
      - {pmid: "11467597", ref: "Schachter S, Nelson RW, Kirk CA. Oral chromium picolinate and control of glycemia in insulin-treated diabetic dogs. JVIM 2001;15:379-84", verified: true}
      - {pmid: "11869052", doi: "10.1053/jfms.2001.0157", ref: "Appleton DJ et al. Dietary chromium tripicolinate supplementation reduces glucose concentrations and improves glucose tolerance in normal-weight cats. JFMS 2002;4:13-25", verified: true}
    notes: "Monitor more closely in cats (theoretical hypoglycemia)."

  - id: fibre__insulin
    ingredient: [psyllium, insoluble_fibre_cellulose, soluble_fibre]
    drug: insulin
    mechanism: "Fibre slows glucose absorption; may change insulin requirement (high-fibre diets studied in diabetic dogs)."
    severity: minor
    action: monitor
    evidence_level: controlled_study_target_species
    evidence_strength: moderate
    citations:
      - {pmid: "10754666", doi: "10.2460/javma.2000.216.1076", ref: "Kimmel SE et al. Effects of insoluble and soluble dietary fiber on glycemic control in dogs with naturally occurring insulin-dependent diabetes mellitus. JAVMA 2000;216:1076-81", verified: true}
      - {pmid: "11873951", doi: "10.1111/j.1748-5827.2002.tb00031.x", ref: "Graham PA et al. Influence of a high fibre diet on glycaemic control and quality of life in dogs with diabetes mellitus. JSAP 2002;43:67-73", verified: true}
    notes: "Kimmel 2000 abstract confirmed: high insoluble-fibre diet lowered mean/max glucose and fructosamine in diabetic dogs (insulin dose unchanged in study). Key point: insulin needs may change when fibre is started or stopped."

  - id: cinnamon__insulin
    ingredient: cinnamon_cassia
    drug: insulin
    mechanism: "Human data suggest modest glucose lowering; cassia contains coumarin; cinnamon oil hepatotoxic per Merck essential oils."
    severity: minor
    action: monitor
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {ref: "Merck essential oils page lists cassia bark and cinnamon oil as hepatotoxic oils", verified: true}
    notes: "No dog/cat glycemia data found."

  - id: alpha_lipoic_acid__insulin
    ingredient: alpha_lipoic_acid
    drug: insulin
    mechanism: "Hypoglycemia observed in dog ALA toxicosis -> additive hypoglycemia."
    severity: moderate
    action: monitor
    evidence_level: case_report_target_species
    evidence_strength: weak
    citations:
      - {pmid: "19821894", ref: "Loftin 2009", verified: true}
    notes: "Cats: ALA excluded regardless."

  - id: iodine_kelp__methimazole
    ingredient: [kelp, iodine, seaweed]
    drug: methimazole
    mechanism: "Excess iodine substrate for thyroid hormone synthesis counteracts antithyroid therapy (mechanistic) and invalidates iodine-restricted diets."
    severity: moderate
    action: avoid
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "30859084", ref: "Loftus 2019 (iodine restriction alone controls hyperthyroidism in most cats)", verified: true}
    notes: "No direct methimazole+iodine study in cats found."

  - id: iodine_kelp__levothyroxine
    ingredient: [kelp, iodine]
    drug: levothyroxine
    mechanism: "Variable iodine load can alter endogenous thyroid function and confound dose titration."
    severity: minor
    action: monitor
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "9876004", ref: "Eliason 1998 (human kelp thyroid case)", verified: true}

  - id: soy__levothyroxine
    ingredient: soy_isoflavones
    drug: levothyroxine
    mechanism: "Soy reduces levothyroxine absorption in humans; soy alters T4 in cats."
    severity: minor
    action: monitor
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "28153426", ref: "Skelin 2017 review (soy listed among absorption factors - assumed, not re-read)", verified: true}
      - {pmid: "15141877", ref: "White 2004 (cats)", verified: true}

  - id: licorice__glucocorticoid
