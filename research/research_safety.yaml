    notes: "Use the conservative 0.1 mg/kg (4,000 IU/kg) acute value for the filter. Chronic dietary excess (pet food recalls) causes toxicosis at far lower daily doses - cap total daily D3 from supplement + diet (AAFCO/FEDIAF max not researched here)."

