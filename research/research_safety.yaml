  - id: phosphorus_sources__hyperphosphatemia
    ingredient: [bone_meal, dicalcium_phosphate, sodium_phosphate, phosphorus_rich_protein_powders]
    condition: hyperphosphatemia
    species: both
    severity: absolute
    action: exclude
    rationale: "IRIS: hyperphosphataemia managed first by dietary phosphate restriction (cat target <1.5 mmol/L but not <0.9)."
    evidence_level: consensus_guideline
    evidence_strength: strong
    citations:
      - {ref: "IRIS 2023 (secondary summary)", verified: false}

  - id: phosphorus_sources__chronic_kidney_disease
    ingredient: [bone_meal, dicalcium_phosphate, phosphorus_supplements]
    condition: chronic_kidney_disease
    species: both
    severity: relative
    action: exclude
    rationale: "Phosphate restriction is core CKD management."
    evidence_level: consensus_guideline
    evidence_strength: strong
    citations:
      - {ref: "IRIS 2023 (secondary summary)", verified: false}

  - id: vitamin_d__chronic_kidney_disease
    ingredient: vitamin_d3_supplemental
    condition: chronic_kidney_disease
    species: both
    severity: relative
    action: vet_review
    rationale: "Risk of hypercalcemia/mineralization; calcitriol only under vet protocol."
    evidence_level: mechanistic_theoretical
    evidence_strength: moderate
    citations:
      - {ref: "Merck Veterinary Manual - Cholecalciferol (renal mineralization)", verified: true}

  - id: salicylate_herbs__chronic_kidney_disease
    ingredient: [white_willow_bark, meadowsweet]
    condition: chronic_kidney_disease
    species: both
    severity: relative
    action: exclude
    rationale: "Salicylates inhibit renal prostaglandins like NSAIDs (mechanistic); cats additionally glucuronidation-deficient."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []

  - id: potassium__chronic_kidney_disease
    ingredient: potassium_gluconate_citrate
    condition: chronic_kidney_disease
    species: both
    severity: none
    action: monitor
    rationale: "NOT a blanket contraindication: hypokalemic CKD cats are commonly supplemented. Risk arises only with hyperkalemia or concurrent ACEi/ARB/spironolactone - see interactions."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {ref: "IRIS 2023 (secondary summary)", verified: false}

  # ---- diabetes ---------------------------------------------------------------
  - id: melatonin__diabetes_mellitus
    ingredient: melatonin
    condition: diabetes_mellitus
    species: both
    severity: relative
    action: monitor
    rationale: "Secondary veterinary sources state melatonin 'could cause insulin resistance in diabetic animals'; rodent data show the opposite. No dog/cat study found."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {ref: "Statement attributed to Plumb's in consumer/vet-blog sources (pawlicy, hepper); Plumb's not read", verified: false}
