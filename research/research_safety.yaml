      - {pmid: "9569166", ref: "Robertson JE, Christopher MM, Rogers QR. Heinz body formation in cats fed baby food containing onion powder. JAVMA 1998;212:1260-6", verified: true}
      - {pmid: "2238384", doi: "10.1177/030098589002700501", ref: "Christopher MM, White JG, Eaton JW. Erythrocyte pathology and mechanisms of Heinz body-mediated hemolysis in cats. Vet Pathol 1990;27:299-310", verified: true}
    notes: "No verified garlic-specific mg/kg threshold for cats; treat any garlic as exclude."

