    notes: "VCA melatonin monograph (read): caution in pregnant/nursing/breeding pets, severe liver disease, immature pets; caution with benzodiazepines, succinylcholine, warfarin, fluvoxamine. Does not mention diabetes. Human melatonin products may contain xylitol."

  - id: high_sugar_carriers__diabetes_mellitus
    ingredient: [molasses, honey, glucose_syrup, maltodextrin_high_load]
    condition: diabetes_mellitus
    species: both
