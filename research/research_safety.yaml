    filter_action: exclude
    toxic_dose:
      - {effect: mild_signs, threshold_mg_per_kg: 20, source: merck_chocolate}
      - {effect: cardiotoxic, threshold_mg_per_kg: "40-50", source: merck_chocolate}
      - {effect: seizures, threshold_mg_per_kg: 60, qualifier: ">=", source: merck_chocolate}
      - {effect: LD50_caffeine_or_theobromine, threshold_mg_per_kg: "100-200", source: merck_chocolate}
      - {effect: minimum_lethal_guarana_in_combo_product, threshold_mg_per_kg: 19.1, source: ooms_2001}
    clinical_signs: [vomiting, diarrhea, polydipsia, hyperactivity, restlessness, tachycardia, arrhythmias, hypertension, tremors, seizures, hyperthermia]
    onset: "6-12 h (chocolate); <8 h for guarana/ma huang product"
    evidence_level: reference_text
    citations:
      - {ref: "Merck Veterinary Manual - Chocolate Toxicosis in Animals", url: "https://www.merckvetmanual.com/toxicology/food-hazards/chocolate-toxicosis-in-animals", verified: true}
      - {pmid: "11195828", doi: "10.2460/javma.2001.218.225", ref: "Ooms TG, Khan SA, Means C. Suspected caffeine and ephedrine toxicosis resulting from ingestion of an herbal supplement containing guarana and ma huang in dogs: 47 cases (1997-1999). JAVMA 2001;218:225-9", verified: true}
      - {pmid: "1158774", ref: "Foor J, Stowe CM. Acute fatal caffeine toxicosis in a dog. JAVMA 1975;167:379", verified: true}
    notes: "Thresholds are summed methylxanthines (caffeine + theobromine). Merck: ~62 g/kg milk chocolate potentially lethal."

  - id: methylxanthines__cat
    ingredient: [caffeine, guarana, green_tea_extract_caffeinated, cocoa_theobromine]
    species: cat
    filter_action: exclude
    toxic_dose:
      - {effect: lethal_range_caffeine, threshold_mg_per_kg: "80-150", source: "vetmeds.org (secondary)", verified: false}
    clinical_signs: [as_dog]
    evidence_level: reference_text
    citations:
      - {ref: "Merck chocolate page notes many species susceptible but gives no cat values", verified: true}
    notes: "Cat-specific numbers unverified; exclude regardless."

  - id: green_tea_extract_egcg__dog
    ingredient: green_tea_extract_egcg_decaffeinated
    species: dog
    filter_action: dose_cap
    toxic_dose:
      - {effect: "extensive morbidity, mortality, multi-organ pathology (fasted dosing)", dose_range_mg_per_kg_day: "200-1000 (study arms)", note: "abstract does not identify a NOAEL", source: kapetanovic_2009}
    clinical_signs: [multi_organ_toxicity, hepatotoxicity_inferred_from_human_data]
    mechanism: "Fasting markedly increases catechin exposure; fed dosing lowered exposure and toxicity."
    evidence_level: controlled_study_target_species
    citations:
      - {pmid: "19464566", doi: "10.1016/j.tox.2009.03.007", ref: "Kapetanovic IM et al. Exposure and toxicity of green tea polyphenols in fasted and non-fasted dogs. Toxicology 2009;260:28-36", verified: true}
      - {pmid: "32625874", doi: "10.2903/j.efsa.2018.5239", ref: "EFSA ANS Panel. Scientific opinion on the safety of green tea catechins. EFSA J 2018;16:e05239 (abstract: >=800 mg EGCG/day as a food supplement significantly increased serum transaminases in clinical trials)", verified: true}
    notes: "Always give with food; exclude in hepatopathy. EGCG is glucuronidated -> theoretical extra risk in cats (unverified)."

  - id: macadamia__dog
    ingredient: macadamia_nut
    species: dog
    filter_action: exclude
    toxic_dose:
      - {effect: clinical_signs, threshold_g_per_kg: 2.4, source: merck_macadamia}
      - {effect: experimental_reproduction, threshold_g_per_kg: 20, source: hansen_2000}
    clinical_signs: [weakness, hindlimb_inability_to_rise, CNS_depression, vomiting, ataxia, tremors, hyperthermia, abdominal_pain, lameness, stiffness]
    onset: "<12 h; resolves 12-48 h"
    evidence_level: case_series_target_species
    citations:
      - {ref: "Merck Veterinary Manual - Macadamia Nut Toxicosis in Dogs", url: "https://www.merckvetmanual.com/toxicology/food-hazards/macadamia-nut-toxicosis-in-dogs", verified: true}
      - {pmid: "10670081", ref: "Hansen SR et al. Weakness, tremors, and depression associated with macadamia nuts in dogs. Vet Hum Toxicol 2000;42:18-21", verified: true}
    notes: "Macadamia nut oil: toxic principle unknown, so treat oil as exclude too (judgement)."

  - id: hops__dog
    ingredient: hops_humulus_lupulus
    species: dog
    filter_action: exclude
    toxic_dose:
      - {effect: malignant_hyperthermia_like_reaction, threshold: "unknown; spent hops", source: duncan_1997}
    clinical_signs: [marked_hyperthermia, restlessness, panting, vomiting, abdominal_pain, seizures, rapid_rigor_mortis, death]
    onset: "mean 3 h"
    mechanism: "Malignant-hyperthermia-like response (Greyhounds over-represented) or uncoupling of oxidative phosphorylation."
    evidence_level: case_series_target_species
    citations:
      - {pmid: "8977648", ref: "Duncan KL, Hare WR, Buck WB. Malignant hyperthermia-like reaction secondary to ingestion of hops in five dogs. JAVMA 1997;210:51-4", verified: true}
    notes: "4/5 dogs died. Hops extracts appear in some 'calming' supplements. Cat data: none found (vet_review/exclude by caution)."

  - id: ephedra_ma_huang__dog_cat
    ingredient: [ephedra_ma_huang, ephedrine, synephrine_bitter_orange_unverified]
    species: both
    filter_action: exclude
    toxic_dose:
      - {effect: minimum_lethal_in_combination_product, species: dog, threshold_mg_per_kg: 5.8, material: ma_huang, source: ooms_2001}
    clinical_signs: [hyperactivity, tremors, seizures, behavior_change, vomiting, tachycardia, hyperthermia, death]
    evidence_level: case_series_target_species
    citations:
      - {pmid: "11195828", doi: "10.2460/javma.2001.218.225", ref: "Ooms 2001 (guarana + ma huang, 47 dogs; 17% died/euthanized)", verified: true}
    notes: "Synephrine grouping is mechanistic (sympathomimetic) and unverified."

  - id: yohimbe__dog_cat
    ingredient: yohimbe_yohimbine
    species: both
    filter_action: exclude
    toxic_dose: []
    clinical_signs: [CNS_excitation_expected, tachycardia_expected, hypertension_expected, tremors_expected]
    mechanism: "Alpha-2 adrenergic antagonist (used veterinary as xylazine reversal)."
    evidence_level: mechanistic_theoretical
    citations:
      - {pmid: "19498277", doi: "10.1292/jvms.71.539", ref: "Talukder H et al. Antagonistic effects of atipamezole and yohimbine on xylazine-induced diuresis in healthy dogs. J Vet Med Sci 2009 (pharmacology only)", verified: true}
    notes: "No veterinary supplement-toxicosis case series found. Exclusion is mechanistic plus no legitimate indication in pet supplements."

  - id: kava__dog_cat
    ingredient: kava_piper_methysticum
    species: both
    filter_action: exclude
    toxic_dose: []
    clinical_signs: [hepatotoxicity_human, sedation_expected]
    evidence_level: extrapolated_human
    citations:
      - {pmid: "34307603", doi: "10.12998/wjcc.v9.i20.5490", ref: "Ballotin VR et al. Herb-induced liver injury: systematic review and meta-analysis. World J Clin Cases 2021 (includes kava)", verified: true}
      - {pmid: "24315480", doi: "10.1016/j.dld.2013.10.020", ref: "Teschke R et al. Herbal hepatotoxicity: analysis of cases with initially reported positive re-exposure tests. Dig Liver Dis 2014", verified: true}
    notes: "No dog/cat data found. Human hepatotoxicity basis only."

  - id: nutmeg__dog
    ingredient: nutmeg_myristicin
    species: dog
    filter_action: exclude
    toxic_dose:
      - {effect: toxicosis, threshold: "~5 g ground nutmeg reported by consumer/vet-clinic pages", verified: false}
    clinical_signs: [vomiting, diarrhea, disorientation, hallucination_like_behavior, tachycardia, hypertension, dry_mouth, abdominal_pain, seizures]
    onset: "3-8 h"
    evidence_level: mechanistic_theoretical
    citations:
      - {ref: "ASPCA/consumer veterinary pages only (gsvs.org, hepper.com); no PubMed source found", verified: false}
    notes: "Weak evidence; trace culinary amounts in food unlikely to matter, but no reason to include in supplements."

  - id: benzoic_acid_benzoates__cat
    ingredient: [benzoic_acid, sodium_benzoate]
    species: cat
    filter_action: exclude
    toxic_dose: []
    clinical_signs: [hyperesthesia, aggression_unverified, convulsions_unverified, death]
    mechanism: "Cats conjugate benzoate poorly (glucuronidation-limited)."
    evidence_level: controlled_study_target_species
    citations:
      - {pmid: "4672555", doi: "10.1136/vr.90.3.53", ref: "Bedford PG, Clarke EG. Experimental benzoic acid poisoning in the cat. Vet Rec 1972;90:53-8", verified: true}
      - {pmid: "5104111", doi: "10.1136/vr.88.23.599", ref: "Bedford PG, Clarke EG. Suspected benzoic acid poisoning in the cat. Vet Rec 1971;88:599-601", verified: true}
    notes: "No abstract online; dose and sign list not verified. Preservative in some liquid supplements."

  - id: zinc__dog_cat
    ingredient: zinc_high_dose
    species: both
    filter_action: dose_cap
    toxic_dose: []
    clinical_signs: [hemolysis, icterus, pancreatitis, acute_kidney_injury, vomiting]
    evidence_level: reference_text
    citations:
      - {ref: "Merck Veterinary Manual - Toxicoses in Animals From Human Multivitamins and Supplements (zinc: hemolysis, icterus, pancreatitis, AKI)", verified: true}
      - {pmid: "23180148", doi: "10.1136/vr.100376", ref: "Blundell R, Adam F. Haemolytic anaemia and acute pancreatitis associated with zinc toxicosis in a dog. Vet Rec 2013", verified: true}
    notes: "Supplement-dose zinc toxicosis threshold not established; most reports are metallic foreign bodies."

  # ---- Feline glucuronidation deficiency: summary node -------------------------
  - id: feline_ugt_deficiency_group__cat
    ingredient: glucuronidation_dependent_compounds
    species: cat
    filter_action: vet_review
    mechanism: "UGT1A6 is a pseudogene in domestic cats (and other Felidae) -> deficient glucuronidation of planar phenols (acetaminophen, salicylate, phenols)."
    members:
      established_toxic: [salicylates_incl_white_willow_bark_and_wintergreen, phenolic_essential_oils, benzoic_acid_benzoates]
      cat_specific_other_mechanism: [propylene_glycol_heinz_bodies, alpha_lipoic_acid_hepatotoxicity, allium_heinz_bodies]
      theoretical_caution_no_cat_toxicity_data: [curcumin, egcg_green_tea, resveratrol, quercetin, silymarin_silybin, other_high_dose_polyphenols, menthol_peppermint_oil]
    evidence_level: controlled_study_target_species
    citations:
      - {pmid: "10862526", doi: "10.1097/00008571-200006000-00009", ref: "Court MH, Greenblatt DJ 2000 Pharmacogenetics", verified: true}
      - {pmid: "21464924", doi: "10.1371/journal.pone.0018046", ref: "Shrestha B et al. Evolution of a major drug metabolizing enzyme defect in the domestic cat and other Felidae. PLoS One 2011;6:e18046", verified: true}
      - {ref: "Merck Veterinary Manual - Essential oils (cats deficient in glucuronyl transferase; very sensitive to phenols)", verified: true}
    notes: "The 'theoretical_caution' list is inference: these polyphenols are glucuronidated in other species, but no cat toxicity data were found. Recommend dose_cap + vet_review, not hard exclusion."

# ---------------------------------------------------------------------------
# 2) CONDITION CONTRAINDICATIONS
# ---------------------------------------------------------------------------
# New condition IDs introduced: acute_pancreatitis_severe, critically_ill,
# gallbladder_disease_biliary_obstruction, protein_losing_enteropathy,
# on_iodine_restricted_diet (modifier), krill/crustacean handled under shellfish_allergy.
condition_contraindications:

  # ---- omega-3 ------------------------------------------------------------
  - id: omega3_fish_oil__pancreatitis_history
    ingredient: omega3_fish_oil_high_dose
    condition: pancreatitis_history
    species: both
    severity: relative
    action: vet_review
    rationale: "Fish oil adds long-chain fat; high-fat intake is the usual dietary concern in pancreatitis-prone dogs. Lenox & Bauer list GI adverse effects; no study shows fish oil causes pancreatitis in dogs/cats."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "23323770", doi: "10.1111/jvim.12033", ref: "Lenox CE, Bauer JE. Potential adverse effects of omega-3 fatty acids in dogs and cats. JVIM 2013;27:217-26", verified: true}
    notes: "Count fish oil toward the total dietary fat budget; prefer concentrated EPA/DHA (less total fat per mg)."

  - id: omega3_fish_oil__hyperlipidemia
    ingredient: omega3_fish_oil
    condition: hyperlipidemia
    species: dog
    severity: none
    action: monitor
    rationale: "NOT a contraindication: omega-3 fatty acids are a listed lipid-lowering therapy for primary hyperlipidemia (e.g., Miniature Schnauzer hypertriglyceridemia) alongside ultra-low-fat diet."
    evidence_level: reference_text
    evidence_strength: moderate
    citations:
      - {pmid: "26456868", doi: "10.1111/jsap.12396", ref: "Xenoulis PG, Steiner JM. Canine hyperlipidaemia. JSAP 2015;56:595-605", verified: true}
    notes: "The filter must NOT exclude omega-3 for hyperlipidemia. It is the vehicle fat (e.g., whole-fish/coconut/MCT oils) that matters."

  - id: omega3_fish_oil__bleeding_disorder
    ingredient: omega3_fish_oil_high_dose
    condition: bleeding_disorder
    species: both
    severity: relative
    action: vet_review
    rationale: "Altered platelet function is a listed potential adverse effect. In cats, high-dose purified EPA/DHA for 2 months did not change bleeding time or platelet aggregation. Human perioperative RCT (8-10 g EPA+DHA) showed no excess bleeding."
    evidence_level: controlled_study_target_species
    evidence_strength: weak
    citations:
      - {pmid: "23323770", ref: "Lenox & Bauer 2013", verified: true}
      - {pmid: "7983618", doi: "10.1111/j.1939-1676.1994.tb03227.x", ref: "Bright JM et al. Effects of n-3 fatty acid supplementation on bleeding time, plasma fatty acid composition, and in vitro platelet aggregation in cats. JVIM 1994;8:247-52", verified: true}
      - {pmid: "9868228", doi: "10.1093/jn/128.12.2645S", ref: "Saker KE et al. Manipulation of dietary n-6 and n-3 fatty acids alters platelet function in cats. J Nutr 1998", verified: true}
      - {pmid: "30571332", doi: "10.1161/CIRCOUTCOMES.118.004584", ref: "Akintoye E et al. Fish oil and perioperative bleeding. Circ Cardiovasc Qual Outcomes 2018 (n=1516; OR 0.81 for major bleeding)", verified: true}
    notes: "Saker 1998 did report altered platelet function with diet n-6:n-3 manipulation (abstract not read; direction/magnitude unverified)."

  - id: omega3_fish_oil__scheduled_surgery
    ingredient: omega3_fish_oil_high_dose
    condition: scheduled_surgery
    species: both
    severity: relative
    action: monitor
    rationale: "Theoretical bleeding/wound-healing concern (Lenox & Bauer list detrimental effects on wound healing). Largest human RCT found no increase in perioperative bleeding."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "30571332", ref: "Akintoye 2018", verified: true}
      - {pmid: "23323770", ref: "Lenox & Bauer 2013", verified: true}

  - id: omega3_fish_oil__obesity
    ingredient: omega3_fish_oil
    condition: obesity
    species: both
    severity: relative
    action: monitor
    rationale: "Weight gain from added calories is a listed adverse effect; account for kcal."
    evidence_level: reference_text
    evidence_strength: weak
    citations:
      - {pmid: "23323770", ref: "Lenox & Bauer 2013", verified: true}

  - id: omega3_fish_oil__diabetes_mellitus
    ingredient: omega3_fish_oil_high_dose
    condition: diabetes_mellitus
    species: both
    severity: relative
    action: monitor
    rationale: "Effects on glycemic control/insulin sensitivity listed as potential adverse effect; direction unclear."
    evidence_level: reference_text
    evidence_strength: weak
    citations:
      - {pmid: "23323770", ref: "Lenox & Bauer 2013", verified: true}

  - id: omega3_fish_oil__dose_ceiling_all
    ingredient: omega3_fish_oil
    condition: any
    species: dog
    severity: relative
    action: reduce_dose
    rationale: "NRC 2006 safe upper limit for EPA+DHA in dogs: 2,800 mg/1,000 kcal (= 280 mg/100 kcal, ~370 mg/kg^0.75 BW). No NRC SUL for cats was found."
    evidence_level: reference_text
    evidence_strength: moderate
    citations:
      - {ref: "NRC 2006 Nutrient Requirements of Dogs and Cats, as quoted by Raditic D, Gaylord L, Today's Veterinary Practice 2020 ('280 mg/100 kcal') and dvm360 Journal Scan ('370 mg/kg^0.75')", url: "https://todaysveterinarypractice.com/nutrition/fish-oil-dosing-in-pet-diets-and-supplements", verified: true}
    notes: "NRC book itself not read; numbers from two secondary sources that agree."

  # ---- glucosamine / shellfish-derived ----------------------------------------
  - id: glucosamine__diabetes_mellitus
    ingredient: glucosamine
    condition: diabetes_mellitus
    species: dog
    severity: relative
    action: monitor
    rationale: "Weak evidence. 21-day glucosamine-chondroitin did not change serum fructosamine in 12 healthy dogs. No study in diabetic dogs/cats found. Concern is extrapolated from early human/rodent insulin-resistance data."
    evidence_level: controlled_study_target_species
    evidence_strength: weak
    citations:
      - {pmid: "20074008", doi: "10.2460/javma.236.2.183", ref: "Lenox CE, Lunn KF. Effects of glucosamine-chondroitin sulfate supplementation on serum fructosamine concentration in healthy dogs. JAVMA 2010;236:183-6", verified: true}
    notes: "Do not exclude; monitor glucose/fructosamine after starting in a diabetic patient."

  - id: glucosamine__shellfish_allergy
    ingredient: glucosamine_crustacean_derived
    condition: shellfish_allergy
    species: both
    severity: relative
    action: vet_review
    rationale: "Most glucosamine is made from crustacean chitin; the allergen is the protein (tropomyosin), which is largely removed. Small human study suggested shellfish-allergic patients tolerated glucosamine. Prefer non-shellfish (fermented/vegetable) glucosamine."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "15341031", doi: "10.1016/j.jaci.2004.05.050", ref: "Gray HC, Hutcheson PS, Slavin RG. Is glucosamine safe in patients with seafood allergy? J Allergy Clin Immunol 2004;114:459-60 (letter; content summarised from memory, abstract not available)", verified: true}

  - id: green_lipped_mussel__shellfish_allergy
    ingredient: green_lipped_mussel_perna_canaliculus
    condition: shellfish_allergy
    species: both
    severity: absolute
    action: exclude
    rationale: "Whole mollusc material; allergenic proteins actin, tropomyosin and paramyosin identified in GLM extract."
    evidence_level: extrapolated_human
    evidence_strength: moderate
    citations:
      - {pmid: "36640062", doi: "10.18502/ijaai.v21i6.11532", ref: "Kage P et al. Identification of New Potential Allergens from Green-lipped Mussel (Perna canaliculus). Iran J Allergy Asthma Immunol 2022;21:711-715", verified: true}
    notes: "Mollusc vs crustacean cross-reactivity is via tropomyosin; treat any shellfish allergy (crustacean or mollusc) as exclude."

  - id: krill_oil__shellfish_allergy
    ingredient: krill_oil
    condition: shellfish_allergy
    species: both
    severity: absolute
    action: exclude
    rationale: "Crustacean-derived; residual protein possible."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []
    notes: "No citation found; mechanistic."

  - id: chitosan__shellfish_allergy
    ingredient: chitosan
    condition: shellfish_allergy
    species: both
    severity: relative
    action: vet_review
    rationale: "Crustacean-shell-derived polysaccharide; human studies found chitosan bandages and chitosan-fined wine safe in shellfish-allergic people."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "22128651", doi: "10.7205/milmed-d-11-00150", ref: "Waibel KH et al. Safety of chitosan bandages in shellfish allergic patients. Mil Med 2011;176:1153-6", verified: true}
      - {pmid: "27009439", doi: "10.1016/j.anai.2016.02.004", ref: "Amaral L et al. Safety of chitosan processed wine in shrimp allergic patients. Ann Allergy Asthma Immunol 2016", verified: true}

  # ---- copper / liver -------------------------------------------------------
  - id: copper__copper_storage_hepatopathy
    ingredient: [copper_any_form, copper_rich_ingredients_liver_organ_meat_shellfish]
    condition: copper_storage_hepatopathy
    species: dog
    severity: absolute
    action: exclude
    rationale: "Copper-associated chronic hepatitis needs lifelong dietary Cu restriction (<0.12 mg/100 kcal; restricted 0.09-0.12 vs AAFCO 0.18 mg/100 kcal) plus chelation. Predisposed: Bedlington Terrier, Labrador Retriever, Doberman Pinscher, Dalmatian, West Highland White Terrier."
    evidence_level: consensus_guideline
    evidence_strength: strong
    citations:
      - {pmid: "30844094", doi: "10.1111/jvim.15467", pmcid: "PMC6524396", ref: "Webster CRL et al. ACVIM consensus statement on the diagnosis and treatment of chronic hepatitis in dogs. JVIM 2019;33:1173-1200", verified: true}
    notes: "Consensus: Cu-restricted diet recommended in all dogs with hepatic Cu >600 ug/g dw. Also flag copper-containing multivitamin/mineral premixes."

  - id: copper__hepatopathy_breed_risk
    ingredient: copper_supplemental
    condition: hepatopathy
    species: dog
    severity: relative
    action: vet_review
    rationale: "Any chronic hepatitis may have Cu accumulation until biopsy Cu quantified; avoid adding supplemental Cu."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "30844094", ref: "ACVIM 2019 chronic hepatitis consensus", verified: true}

  - id: kava__hepatopathy
    ingredient: kava
    condition: hepatopathy
    species: both
    severity: absolute
    action: exclude
    rationale: "Human herb-induced liver injury."
    evidence_level: extrapolated_human
    evidence_strength: moderate
    citations:
      - {pmid: "34307603", ref: "Ballotin 2021", verified: true}

  - id: green_tea_extract__hepatopathy
    ingredient: green_tea_extract_egcg
    condition: hepatopathy
    species: both
    severity: absolute
    action: exclude
    rationale: "Human EGCG hepatotoxicity (EFSA 2018); multi-organ toxicity in fasted dogs."
    evidence_level: controlled_study_target_species
    evidence_strength: moderate
    citations:
      - {pmid: "32625874", ref: "EFSA 2018 green tea catechins", verified: true}
      - {pmid: "19464566", ref: "Kapetanovic 2009", verified: true}

  - id: alpha_lipoic_acid__hepatopathy
    ingredient: alpha_lipoic_acid
    condition: hepatopathy
    species: both
    severity: relative
    action: vet_review
    rationale: "Hepatotoxic in cats (exclude for cats regardless); hepatic injury in dog overdose cases."
    evidence_level: controlled_study_target_species
    evidence_strength: moderate
    citations:
      - {pmid: "15059240", ref: "Hill 2004", verified: true}
      - {pmid: "19821894", ref: "Loftin 2009", verified: true}

  - id: vitamin_a__hepatopathy
    ingredient: vitamin_a_high_dose_incl_cod_liver_oil
    condition: hepatopathy
    species: both
    severity: relative
    action: reduce_dose
    rationale: "Hepatic stellate-cell storage; hypervitaminosis A hepatic fibrosis reported in a cat."
    evidence_level: case_report_target_species
    evidence_strength: weak
    citations:
      - {pmid: "24563496", ref: "Guerra 2014", verified: true}

  - id: milk_thistle__hepatopathy
    ingredient: silymarin_milk_thistle
    condition: hepatopathy
    species: dog
    severity: none
    action: monitor
    rationale: "NOT contraindicated (used as hepatoprotectant; toxicity rare), but efficacy equivocal and silymarin inhibits some CYP450/P-gp - caution with polypharmacy."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "30844094", ref: "ACVIM 2019 chronic hepatitis consensus", verified: true}

  # ---- urolithiasis ----------------------------------------------------------
  - id: high_purine__urate_urolithiasis
    ingredient: [brewers_yeast, yeast_extract, nucleotides, organ_meats_liver_kidney, sardine_anchovy_fish_meal, high_purine_protein_powders]
    condition: urate_urolithiasis
    species: both
    severity: absolute
    action: exclude
    rationale: "ACVIM: limit purine intake, promote alkaline urine (pH >=7) and dilute urine to prevent urate recurrence; high-purine foods include organ meats and fish. Highest risk: SLC2A9 hyperuricosuria (Dalmatian, Bulldog) and portovascular anomalies (Yorkshire Terrier, Pug)."
    evidence_level: consensus_guideline
    evidence_strength: strong
    citations:
      - {pmid: "27611724", doi: "10.1111/jvim.14559", pmcid: "PMC5032870", ref: "Lulich JP et al. ACVIM Small Animal Consensus Recommendations on the Treatment and Prevention of Uroliths in Dogs and Cats. JVIM 2016;30:1564-1574", verified: true}
    notes: "The consensus names organ meats and fish; brewer's yeast is included because yeast is nucleic-acid rich (general nutrition knowledge, not named in the consensus). Also: allopurinol-treated dogs on high-purine intake risk xanthine uroliths."

  - id: urinary_acidifiers__urate_urolithiasis
    ingredient: [dl_methionine, ammonium_chloride, cranberry_high_dose, vitamin_c_high_dose]
    condition: urate_urolithiasis
    species: both
    severity: relative
    action: exclude
    rationale: "Urate prevention requires alkaline urine; acidifiers oppose this."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "27611724", ref: "ACVIM 2016 urolith consensus", verified: true}
    notes: "Whether cranberry meaningfully acidifies pet urine is not established."

  - id: vitamin_c__calcium_oxalate_urolithiasis
    ingredient: vitamin_c_ascorbic_acid_supplemental
    condition: calcium_oxalate_urolithiasis
    species: both
    severity: relative
    action: exclude
    rationale: "Ascorbate is metabolized to oxalate. Human cohort: supplemental ascorbic acid associated with ~2x kidney stone incidence in men. No dog/cat outcome data."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "23381591", doi: "10.1001/jamainternmed.2013.2296", ref: "Thomas LD et al. Ascorbic acid supplements and kidney stone incidence among men: a prospective study. JAMA Intern Med 2013;173:386-8", verified: true}
      - {pmid: "26463139", doi: "10.1053/j.ajkd.2015.09.005", ref: "Ferraro PM et al. Total, dietary, and supplemental vitamin C intake and risk of incident kidney stones. Am J Kidney Dis 2016", verified: true}
    notes: "The ~2x figure is from my recollection of Thomas 2013 (abstract not available in PubMed) - verify. Dogs/cats synthesize vitamin C; no requirement."

  - id: urinary_acidifiers__calcium_oxalate_urolithiasis
    ingredient: [dl_methionine, ammonium_chloride, cranberry_high_dose]
    condition: calcium_oxalate_urolithiasis
    species: both
    severity: relative
    action: vet_review
    rationale: "ACVIM: to minimize CaOx recurrence, avoid urine acidification and excessive protein; consider citrate if urine persistently acidic."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "27611724", ref: "ACVIM 2016 urolith consensus (Recommendation 3.3)", verified: true}

  - id: cranberry__calcium_oxalate_urolithiasis
    ingredient: cranberry_extract
    condition: calcium_oxalate_urolithiasis
    species: both
    severity: relative
    action: vet_review
    rationale: "Conflicting human data: cranberry concentrate tablets raised urinary oxalate by a mean 43.4% in 5 volunteers (Terris 2001), whereas cranberry juice lowered oxalate and CaOx supersaturation (McHarg 2003); Gettman 2005 mixed. No dog/cat data."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "11164137", doi: "10.1016/s0090-4295(00)00884-0", ref: "Terris MK et al. Dietary supplementation with cranberry concentrate tablets may increase the risk of nephrolithiasis. Urology 2001;57:26-9", verified: true}
      - {pmid: "14616463", doi: "10.1046/j.1464-410x.2003.04472.x", ref: "McHarg T et al. Influence of cranberry juice on the urinary risk factors for calcium oxalate kidney stone formation. BJU Int 2003;92:765-8", verified: true}
      - {pmid: "16006907", doi: "10.1097/01.ju.0000165168.68054.f8", ref: "Gettman MT et al. Effect of cranberry juice consumption on urinary stone risk factors. J Urol 2005;174:590-4", verified: true}
    notes: "Supplement extracts (concentrated) are closer to the Terris tablet scenario."

  - id: vitamin_d_calcium__calcium_oxalate_urolithiasis
    ingredient: [vitamin_d3_supplemental, calcium_supplemental]
    condition: calcium_oxalate_urolithiasis
    species: both
    severity: relative
    action: vet_review
    rationale: "CaOx is driven mainly by hypercalciuria (with hypercalcemia or normocalcemia); controlling hypercalcemia aids prevention. Supplemental vitamin D/calcium can raise urinary calcium."
    evidence_level: consensus_guideline
    evidence_strength: moderate
    citations:
      - {pmid: "27611724", ref: "ACVIM 2016 urolith consensus", verified: true}
    notes: "Consensus does not explicitly name vitamin D supplements; inference from hypercalciuria mechanism."

  - id: alkalinizers__struvite_urolithiasis
    ingredient: [potassium_citrate, sodium_bicarbonate, alkalinizing_supplements]
    condition: struvite_urolithiasis
    species: both
    severity: relative
    action: vet_review
    rationale: "Struvite precipitates in alkaline urine; dissolution/prevention diets acidify urine. Alkalinizers oppose this."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "27611724", ref: "ACVIM 2016 urolith consensus (struvite dissolution)", verified: true}
    notes: "Phosphate/magnesium-rich supplements also relevant (mechanistic)."

  # ---- calcium / phosphorus / kidney -------------------------------------------
  - id: calcium_binders__hypercalcemia
    ingredient: [calcium_carbonate, calcium_lactate_gluconate, calcium_containing_phosphate_binders, chitosan_calcium_carbonate_binders]
    condition: hypercalcemia
    species: both
    severity: absolute
    action: exclude
    rationale: "IRIS: calcium-containing phosphate binders should be avoided in hypercalcaemia and in patients receiving vitamin D/calcitriol; monitor ionised calcium."
    evidence_level: consensus_guideline
    evidence_strength: strong
    citations:
      - {ref: "IRIS Treatment Recommendations for CKD in Cats (2023)", url: "https://ca.idexx.com/files/iris-cat-treatment-recommendations-2023-en.pdf", verified: false, note: "PDF located but text could not be extracted; wording taken from secondary summaries of IRIS (vettimes, veterinary-practice). Re-verify."}
      - {pmid: "29582226", doi: "10.1007/s11259-018-9719-z", ref: "Biasibetti E et al. Long term feed supplementation based on phosphate binders in feline CKD (calcium carbonate, calcium lactate-gluconate, chitosan, sodium bicarbonate). Vet Res Commun 2018", verified: true}

  - id: vitamin_d__hypercalcemia
