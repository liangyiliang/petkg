    notes: "Overdose toxin in dogs; no verified mg/kg threshold (abstract gives none). Hypoglycemia relevant to insulin interaction."

  - id: allium__dog
    ingredient: allium_onion_garlic_leek_chive
    species: dog
    filter_action: exclude
    toxic_dose:
      - {effect: clinical_hemolytic_signs, material: raw_onion, threshold_g_per_kg: "15-30", source: merck_allium}
      - {effect: heinz_bodies_eccentrocytes_no_frank_anemia, material: whole_garlic_equivalent, threshold_g_per_kg_per_day: 5, duration: "7 days", source: lee_2000}
    clinical_signs: [lethargy, anorexia, tachypnea, tachycardia, weakness, exercise_intolerance, icterus, hemoglobinuria, collapse, death, heinz_body_anemia, eccentrocytosis, methemoglobinemia]
    onset: "oxidative RBC injury within 24 h; anemia signs may take several days"
    mechanism: "Organosulfur compounds (e.g., n-propyl disulfide, allyl thiosulfates) oxidize hemoglobin and RBC membranes."
    evidence_level: controlled_study_target_species
    citations:
      - {ref: "Merck Veterinary Manual - Garlic and Onion (Allium spp) Toxicosis in Animals", url: "https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals", verified: true}
      - {pmid: "11108195", doi: "10.2460/ajvr.2000.61.1446", ref: "Lee KW et al. Hematologic changes associated with the appearance of eccentrocytes after intragastric administration of garlic extract to dogs. Am J Vet Res 2000;61:1446-50", verified: true}
    notes: "Concentrated forms (powder, dehydrated, garlic supplements/extracts) highest risk. Japanese breeds (Akita, Shiba) reported more sensitive in literature - NOT verified this session."

  - id: allium__cat
    ingredient: allium_onion_garlic_leek_chive
    species: cat
    filter_action: exclude
    toxic_dose:
      - {effect: toxicosis, material: raw_onion, threshold_g_per_kg: 5, source: merck_allium}
      - {effect: toxicosis, material: cooked_onion, threshold: "< 1 teaspoon reported", source: merck_allium}
      - {effect: heinz_bodies_dose_dependent, material: onion_powder_in_diet, threshold_percent_diet: "0.3-2.5 (Heinz bodies); 2.5% decreased PCV", source: robertson_1998}
    clinical_signs: [heinz_body_anemia, lethargy, tachypnea, icterus, hemoglobinuria, methemoglobinemia_mild]
    mechanism: "As dogs; feline hemoglobin is especially susceptible to oxidative Heinz body formation."
