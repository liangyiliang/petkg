    condition: bleeding_disorder
    species: dog
    severity: relative
    action: exclude
    rationale: "Salicylate antiplatelet effect (mechanistic; salicin weaker than aspirin)."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations: []

