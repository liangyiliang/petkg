      - {pmid: "12495265", doi: "10.1046/j.1440-6047.2002.00296.x", ref: "Rasyid A et al. Effect of different curcumin dosages on human gall bladder. Asia Pac J Clin Nutr 2002;11:314-8", verified: true}

  - id: curcumin__bleeding_disorder
    ingredient: turmeric_curcumin
    condition: bleeding_disorder
    species: both
    severity: relative
    action: monitor
    rationale: "In-vitro antiplatelet activity; in rats curcumin altered warfarin/clopidogrel PK but did not change anticoagulation or platelet aggregation."
    evidence_level: mechanistic_theoretical
    evidence_strength: weak
    citations:
      - {pmid: "23807811", doi: "10.1055/s-0032-1328652", ref: "Liu AC et al. Curcumin alters the pharmacokinetics of warfarin and clopidogrel in Wistar rats but has no effect on anticoagulation or antiplatelet aggregation. Planta Med 2013;79:971-7", verified: true}

  - id: antiplatelet_herbs__scheduled_surgery
    ingredient: [ginkgo, garlic, ginger_high_dose, curcumin_high_dose, vitamin_e_high_dose, white_willow_bark]
    condition: scheduled_surgery
    species: both
    severity: relative
    action: vet_review
