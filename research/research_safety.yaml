  # ---- probiotics -----------------------------------------------------------
  - id: probiotics__immunosuppressed
    ingredient: [probiotics_live_bacteria, saccharomyces_boulardii]
    condition: immunosuppressed
    species: both
    severity: relative
    action: vet_review
    rationale: "Human reports of Saccharomyces fungemia (often linked to S. boulardii products) and Lactobacillus bacteremia in immunocompromised/critically ill patients. No dog/cat case reports were found."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "36806741", doi: "10.1093/mmy/myad014", ref: "Vinayagamoorthy K et al. Epidemiology of Saccharomyces fungemia: a systematic review. Med Mycol 2023;61", verified: true}
      - {pmid: "33934809", doi: "10.1016/j.idnow.2020.12.003", ref: "Poncelet A et al. S. cerevisiae fungemia: risk factors, outcome and links with S. boulardii-containing probiotic administration. Infect Dis Now 2021", verified: true}
    notes: "Includes patients on cyclosporine, high-dose glucocorticoids, chemotherapy, neutropenia, central lines."

  - id: probiotics__critically_ill
    ingredient: probiotics_live
    condition: critically_ill
    new_condition_id: true
    species: both
    severity: relative
    action: vet_review
    rationale: "Human RCT (PROPATRIA): probiotic prophylaxis in predicted severe acute pancreatitis increased mortality (incl. bowel ischaemia)."
    evidence_level: extrapolated_human
    evidence_strength: moderate
    citations:
      - {pmid: "18279948", doi: "10.1016/S0140-6736(08)60207-X", ref: "Besselink MG et al. Probiotic prophylaxis in predicted severe acute pancreatitis: a randomised, double-blind, placebo-controlled trial. Lancet 2008;371:651-659", verified: true}
    notes: "Abstract confirmed: mortality 24/152 (16%) probiotics vs 9/144 (6%) placebo; infectious complications not reduced (RR 1.06). Bowel ischaemia detail not re-read. Applies also to new ID acute_pancreatitis_severe."

  # ---- vitamin E, curcumin, garlic, ginkgo: haemostasis --------------------------
  - id: vitamin_e_high_dose__bleeding_disorder
    ingredient: vitamin_e_high_dose
    condition: bleeding_disorder
    species: both
    severity: relative
    action: vet_review
    rationale: "Human data: high-dose vitamin E can antagonize vitamin K-dependent coagulation and potentiate warfarin. No dog/cat data found."
    evidence_level: extrapolated_human
    evidence_strength: weak
    citations:
      - {pmid: "25225959", doi: "10.1017/S0954422414000146", ref: "Podszun M, Frank J. Vitamin E-drug interactions: molecular basis and clinical relevance. Nutr Res Rev 2014;27:215-31", verified: true}
