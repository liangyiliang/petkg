# Dosing research for the pet supplement knowledge graph (dogs and cats)
# Compiled 2026-10-03. Every PMID/DOI below was checked against PubMed E-utilities
# (esummary/efetch) or, for non-indexed items, the publisher PDF/page. Numbers come from
# the abstract or full text (Europe PMC) unless a field's `status` says otherwise.
#
# status vocabulary (one per value or block):
#   verified          - number read directly in the primary source (abstract/full text/label page)
#   verified_secondary- number read in a reputable secondary source that cites the primary
#                       (e.g. Lenox & Bauer 2013 quoting NRC 2006); primary not opened
#   derived           - arithmetic on verified numbers (e.g. label mg / weight band); method shown
#   unverified        - commonly quoted value that could not be confirmed; do NOT treat as fact
#
# dose_basis vocabulary: mg_per_kg | mg_per_kg_0.75 | per_animal_fixed | per_weight_band
# Diet-inclusion studies (% of diet, per 1000 kcal) are energy-proportional and map to
# mg_per_kg_0.75 (dog MER ~95-110 kcal/kg^0.75; cat ~75-100 kcal/kg^0.67, per FEDIAF).
#
# NRC 2006 itself could not be opened online (NAP reader blocked). NRC values are therefore
# verified_secondary at best. FEDIAF 2025 guidelines PDF was downloaded and read directly.

meta:
  compiled: "2026-10-03"
  primary_regulatory_sources:
    nrc_2006: "National Research Council (2006) Nutrient Requirements of Dogs and Cats. National Academies Press. https://nap.nationalacademies.org/catalog/10668 (not opened directly; values via secondary sources)"
    fediaf_2025: "FEDIAF Nutritional Guidelines for Complete and Complementary Pet Food for Cats and Dogs, publication September 2025. https://europeanpetfood.org/wp-content/uploads/2025/09/FEDIAF-Nutritional-Guidelines_2025-ONLINE.pdf (read directly)"
    aafco: "AAFCO Dog and Cat Food Nutrient Profiles (Official Publication; not opened directly). Values via Jewell & Panickar 2023."
  important_caveat_food_vs_supplement: >
    NRC SULs, FEDIAF maxima and AAFCO maxima are concentrations in a complete diet
    (per kg DM or per 1000 kcal ME). To compare a supplement dose, convert the animal's
    daily energy intake (kcal) x limit/1000 kcal, then subtract what the base diet already supplies.

weight_band_vs_mg_per_kg_note: >
  For most nutraceuticals (glucosamine/chondroitin, SAMe/silybin, cobalamin, L-theanine,
  alpha-casozepine, UC-II, probiotics, Epakitin) the only dose ever tested clinically was
  either a fixed per-animal amount or the manufacturer's weight bands. Converting those to
  mg/kg gives wide, step-shaped ranges (small dogs get much higher mg/kg than large dogs in
  the same band). Recommendation for the graph: store the manufacturer band table as the
  practical dose (dose_basis: per_weight_band) and keep a derived mg/kg range only as a
  cross-product comparison aid. mg/kg (or mg/kg^0.75) is the better primary basis only where
  dose-finding or consensus data exist in those units: omega-3 EPA+DHA (Bauer; NRC SUL in
  mg/kg^0.75), SAMe 20 mg/kg (ACVIM consensus), silybin-PC 0.7-6 mg/kg (ACVIM), vitamin E
  10 IU/kg (ACVIM), zinc 2-3 mg/kg elemental (White 2001), L-carnitine ~50 mg/kg q8h,
  alpha-casozepine 15 mg/kg (Beata 2007), eggshell membrane 13.5 mg/kg (Ruff 2016),
  GLM 20-49 mg/kg (Hielm-Bjorkman 2009). Probiotics are genuinely per_animal_fixed
  (CFU/day), except VSL#3 in Rossi 2014, which was dosed per 10 kg.
  Bands from Cosequin/Dasuquin and Denamarin work out to similar per-kg doses as
  the mg/kg consensus values (Denamarin ~ 15-30 mg/kg SAMe; Cosequin loading ~ 33-125 mg/kg
  glucosamine), but Welactin softgel bands (~28 mg/kg EPA+DHA) sit below the Bauer
  therapeutic range. Weight bands from brands therefore cannot replace mg/kg for omega-3.

ingredients:

  - id: omega3_epa_dha
    name: "Omega-3 fatty acids (EPA + DHA, fish oil)"
    dog:
      dose_basis: mg_per_kg   # SUL expressed in mg_per_kg_0.75; therapeutic ranges in mg/kg
      doses:
        - need: general_therapeutic_range
          min: 50
          max: 220
          unit: "mg EPA+DHA/kg/day"
          notes: "Lower end most often used for inflammatory, renal and cardiac disease; highest for osteoarthritis."
          status: verified_secondary
          refs: [lenox_bauer_2013, bauer_2011, raditic_gaylord_2020]
        - need: osteoarthritis
          target: 310
          unit: "mg EPA+DHA/kg^0.75/day"
          notes: "Bauer 2011 recommendation as quoted in secondary sources (~ 175 mg/kg for a 20 kg dog). Fish-oil dose-titration in OA dogs showed dose-dependent serum EPA/DHA and modest clinical gains at ~3x the baseline food level (Fritsch 2010). Published OA trials span EPA 48-100 mg/kg + DHA 20-32 mg/kg (Vendramini 2025 review)."
          status: verified_secondary
          refs: [bauer_2011, fritsch_2010, vendramini_2025]
        - need: atopic_dermatitis_skin
          min: 1.65
          max: 73
          unit: "mg EPA+DHA/kg/day (range across published trials: EPA 0.99-43 + DHA 0.66-30 mg/kg)"
          status: verified_secondary
          refs: [vendramini_2025]
        - need: cardiac_disease
          min: 45
          max: 95
          unit: "mg EPA+DHA/kg/day (trials: EPA 27-54.2 + DHA 18-40.6 mg/kg)"
          status: verified_secondary
          refs: [vendramini_2025]
        - need: cardiac_cachexia_anorexia
          target: 65
          unit: "mg/kg/day as EPA 40 mg/kg + DHA 25 mg/kg"
          notes: "Freeman's recommendation (VIN proceedings, seen only as search snippet); the underlying RCT (Freeman 1998) showed fish oil improved cachexia and lowered IL-1."
          status: verified_secondary
          refs: [freeman_1998, freeman_vin_proceedings]
        - need: chronic_kidney_disease
          min: 50
          unit: "mg EPA+DHA/kg/day (lower end of Bauer range)"
          notes: "No CKD-specific mg/kg dose was verified for dogs. Brown 1998 (renal-insufficient dogs) used diet-level fish oil."
          status: unverified
          refs: [lenox_bauer_2013, brown_1998]
        - need: dyslipidemia
          target: 104
          unit: "mg EPA+DHA/kg/day (single study: EPA 58.8 + DHA 45.4 mg/kg)"
          status: verified_secondary
          refs: [vendramini_2025]
      sul:
        value: 370
        unit: "mg EPA+DHA/kg^0.75/day (= 2,800 mg/1,000 kcal ME); 10 kg dog = 2,080 mg/day"
        source: "NRC 2006, as quoted in Lenox & Bauer 2013"
        status: verified_secondary
      adverse_effects_high_dose:
        - "Altered platelet function / prolonged bleeding"
        - "GI effects incl. diarrhoea (no reports of fish oil causing pancreatitis in dogs, cats or humans per Lenox & Bauer)"
        - "Delayed wound healing (caution peri-operatively)"
        - "Lipid peroxidation; increased vitamin E requirement"
        - "Weight gain (calories); altered immune/neutrophil function; effects on glycaemic control/insulin sensitivity"
        - "Toxin/heavy-metal exposure from poor-quality oils; drug interactions (antiplatelet drugs)"
      adverse_refs: [lenox_bauer_2013]
      product_weight_bands:
        - product: "Welactin Canine softgel (Nutramax)"
          content: "155 mg EPA + 100 mg DHA per softgel"
          band: "1 softgel per 20 lb (9.1 kg) BW daily"
          derived_mg_per_kg: "~28 mg EPA+DHA/kg/day; below the Bauer 50-220 mg/kg therapeutic range"
          status: verified_secondary   # retailer label reproduction
          refs: [welactin_label]
        - product: "Welactin Canine liquid"
          content: "1,330 mg EPA+DHA per 6 mL scoop"
          band: "5-9 lb 1/2 scoop every other day; 10-19 lb 1/2 scoop/day; 20-44 lb 1 scoop; 45-79 lb 1.5; 80-114 lb 2; >=115 lb 2.5"
          derived_mg_per_kg: "20-44 lb (9-20 kg) band = ~66-147 mg/kg/day"
          status: derived
          refs: [welactin_label]
    cat:
      dose_basis: mg_per_kg
      doses:
        - need: chronic_kidney_disease
          target: 112
          unit: "mg EPA+DHA/kg/day (derived from renal diet providing ~200 mg/100 kcal)"
          status: verified_secondary
          refs: [raditic_gaylord_2020, plantinga_2005]
        - need: osteoarthritis_djd
          target: 120
          unit: "mg EPA+DHA/kg/day (derived from therapeutic diet with 188 mg EPA+DHA/100 kcal)"
          status: verified_secondary
          refs: [raditic_gaylord_2020, lascelles_2010]
      sul:
        value: null
        note: "NRC 2006: not enough published data to set an SUL for cats (per Lenox & Bauer 2013)."
        status: verified_secondary
      adverse_effects_high_dose: ["As for dogs; toxin/heavy-metal exposure noted more frequently in cats (Lenox & Bauer 2013)"]
      adverse_refs: [lenox_bauer_2013]

  - id: glucosamine
    name: "Glucosamine (HCl or sulfate)"
    dog:
      dose_basis: per_weight_band
      doses:
        - need: osteoarthritis_joint_support
          notes: >
            No authoritative mg/kg dose exists; review states therapeutic inclusion level for
            glucosamine in dogs is not established and oral bioavailability is low (12% for
            GlcN HCl in beagles). The commonly quoted '20-25 mg/kg' could not be traced to a
            primary source (unverified). Label-derived Cosequin DS loading dose =
            ~33-125 mg/kg/day (see bands); maintenance is roughly half.
          derived_min: 33
          derived_max: 125
          unit: "mg glucosamine HCl/kg/day (Cosequin DS initial 4-6 wk, derived)"
          status: derived
          refs: [bhathal_2017, adebowale_2002, cosequin_ds_label]
      sul:
        value: null
        note: "Not a nutrient; no NRC/AAFCO/FEDIAF limit. No formal NOAEL in dogs found."
        status: verified
      adverse_effects_high_dose:
        - "Hypersensitivity; minor GI effects (flatulence, stool softening) (Plumb 2015 via Bhathal 2017)"
        - "Accidental mass ingestion of flavoured joint chews reported to ASPCA APCC (Khan 2010 JAVMA letter); clinical details not verified (no abstract)"
      adverse_refs: [bhathal_2017, khan_2010]
      product_weight_bands:
        - product: "Cosequin DS capsules (Nutramax)"
          content: "glucosamine HCl 500 mg + sodium chondroitin sulfate 400 mg + manganese 2.5 mg per capsule"
          initial_4_6_weeks: {"<10 lb": "1/2 cap/day", "10-24 lb": "1/2 cap BID", "25-49 lb": "1 cap BID", "50-100 lb": "2 caps AM + 1 PM", ">100 lb": "2 caps BID"}
          maintenance: "Reduced after 6 wk (e.g. <10 lb 1/2 cap/day); full maintenance table was truncated in the retailer page and is unverified"
          status: verified_secondary
          refs: [cosequin_ds_label]
        - product: "Dasuquin Advanced chewable (Nutramax)"
          content: "S/M: GlcN HCl 600 mg, MSM 400 mg, CS 250 mg, ASU 45 mg, blend 70 mg (boswellia, curcuma, green tea, ALA), Mn 3 mg. Large: GlcN 900 mg, MSM 800 mg, CS 350 mg, ASU 90 mg, blend 140 mg, Mn 5 mg"
          bands: {"<10 lb": "0.5 tab initial / 0.5 maint", "10-29 lb": "1 / 0.5", "30-59 lb": "2 / 1", "60-120 lb": "2 / 1 (large tab)"}
          status: verified
          refs: [dasuquin_advanced_label]
    cat:
      dose_basis: per_weight_band
      doses:
        - need: osteoarthritis_djd
          derived_target: "~31 mg glucosamine HCl/kg/day for a 4 kg cat on 1 capsule"
          status: derived
          refs: [dasuquin_cat_label]
      sul: {value: null, status: verified, note: "none established"}
      adverse_effects_high_dose: ["GI upset (extrapolated from dogs; no feline safety study verified)"]
      product_weight_bands:
        - product: "Dasuquin for Cats sprinkle capsules"
          content: "GlcN HCl 125 mg, low-MW sodium chondroitin sulfate 100 mg, ASU powder 25 mg, Boswellia extract 11 mg, green tea extract 9 mg per capsule"
          bands: {"<10 lb": "1 capsule/day for 4-6 wk", ">=10 lb": "2 capsules/day for 4-6 wk", "maintenance": "halve the number"}
          status: verified_secondary
          refs: [dasuquin_cat_label]

  - id: chondroitin_sulfate
    name: "Chondroitin sulfate"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: osteoarthritis_joint_support
          min: 15
          max: 30
          unit: "mg/kg/day (adjunctive; Plumb 2015 via Bhathal 2017)"
          status: verified_secondary
          refs: [bhathal_2017]
        - need: osteoarthritis_label_loading
          derived_min: 26
          derived_max: 100
          unit: "mg/kg/day from Cosequin DS initial bands (400 mg/capsule)"
          status: derived
          refs: [cosequin_ds_label]
      notes: "Oral bioavailability ~5% in beagles (Adebowale 2002). Usually combined with glucosamine; McCarthy 2007 RCT found Glu/CS effective by day 70 but slower than carprofen (dose not in abstract)."
      sul: {value: null, status: verified, note: "none established"}
      adverse_effects_high_dose: ["Minor GI effects; hypersensitivity (Plumb via Bhathal 2017)"]
      adverse_refs: [bhathal_2017]
      refs: [adebowale_2002, mccarthy_2007]
    cat:
      dose_basis: per_weight_band
      doses:
        - need: osteoarthritis_djd
          derived_target: "~25 mg/kg/day for a 4 kg cat on 1 Dasuquin-for-Cats capsule (100 mg)"
          status: derived
          refs: [dasuquin_cat_label]
      sul: {value: null, status: verified}
      adverse_effects_high_dose: ["unverified for cats"]

  - id: green_lipped_mussel
    name: "Green-lipped mussel (Perna canaliculus) powder/extract"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: osteoarthritis
          min: 20
          max: 49
          unit: "mg/kg/day GLM powder (loading: 4 caps/day <=40 kg, 6 caps/day >40 kg for 10 d), then half (~10-25 mg/kg)"
          notes: "GLM less effective than carprofen but better than placebo; no side effects detected. Earlier trial using 25% of this dose (Dobenecker) found no effect."
          status: verified
          refs: [hielm_bjorkman_2009]
      sul: {value: null, status: verified, note: "none established; rat lipid fraction non-gastrotoxic at 300 mg/kg (cited in Hielm-Bjorkman)"}
      adverse_effects_high_dose: ["None detected in RCT; shellfish allergy is a theoretical contraindication (unverified)"]
      refs: [bierer_2002, pollard_2006, hielm_bjorkman_2009]
    cat:
      dose_basis: unverified
      doses:
        - need: osteoarthritis
          status: unverified
          notes: "Only combination products / GLM-enriched diet studied (Corbee 2022; Lascelles 2010 diet). No standalone feline dose verified."
          refs: [corbee_2022, lascelles_2010]
      sul: {value: null}

  - id: undenatured_collagen_type_ii
    name: "Undenatured type II collagen (UC-II)"
    dog:
      dose_basis: per_animal_fixed
      doses:
        - need: osteoarthritis_mobility
          target: 40
          unit: "mg UC-II product/dog/day (= 10 mg active collagen; >=3% undenatured type II collagen) regardless of size"
          notes: "Deparle 2005: 1 vs 10 mg/day for 90 d; 10 mg gave greater improvement. Commercial products provide 40 mg/day. Stabile 2019: UC-II 1 tablet/day comparable to robenacoxib at 30 d."
          status: verified
          refs: [deparle_2005, d_altilio_2007, varney_2022, stabile_2019, zapata_2023]
      sul: {value: null, status: verified, note: "No adverse effects or serum chemistry changes at 1 or 10 mg/day"}
      adverse_effects_high_dose: ["None reported in canine trials"]
      adverse_refs: [deparle_2005, d_altilio_2007]
    cat:
      dose_basis: unverified
      doses: [{need: osteoarthritis, status: unverified, notes: "No feline clinical studies found."}]
      sul: {value: null}

  - id: msm
    name: "Methylsulfonylmethane (MSM)"
    dog:
      dose_basis: per_weight_band
      doses:
        - need: joint_support
          min: 50
          max: 100
          unit: "mg/kg/day (blog/commercial claim only)"
          status: unverified
          notes: "No peer-reviewed canine dose-finding or efficacy study found. Practical source = product bands, e.g. Dasuquin Advanced 400 mg (S/M) or 800 mg (large) MSM per tablet."
          refs: [dasuquin_advanced_label]
      sul:
        value: 1500
        unit: "mg/kg/day for 90 days in rats (no adverse effects); acute 2 g/kg no adverse effects"
        source: "Horvath 2002 (rat study; not canine)"
        status: verified
      adverse_effects_high_dose: ["None characterised in dogs; GI upset is plausible (unverified)"]
      refs: [horvath_2002]
    cat:
      dose_basis: unverified
      doses: [{need: joint_support, status: unverified}]
      sul: {value: null}

  - id: avocado_soybean_unsaponifiables
    name: "Avocado/soybean unsaponifiables (ASU)"
    dog:
      dose_basis: per_weight_band
      doses:
        - need: osteoarthritis_experimental
          target: 10
          unit: "mg/kg/day for 8 weeks (experimental ACL-transection OA model; reduced lesion size)"
          status: verified
          refs: [boileau_2009]
        - need: osteoarthritis_commercial
          notes: "Dasuquin Advanced: 45 mg (S/M tab) or 90 mg (large tab) ASU; e.g. 2 S/M tabs for 30-59 lb dog = ~3-7 mg/kg/day (derived)"
          status: derived
          refs: [dasuquin_advanced_label]
      sul: {value: null, status: verified, note: "none established"}
      adverse_effects_high_dose: ["Not characterised in dogs (unverified)"]
    cat:
      dose_basis: per_weight_band
      doses:
        - need: osteoarthritis
          notes: "Dasuquin for Cats 25 mg ASU per capsule (1-2 capsules/day by weight). No feline efficacy/safety study verified."
          status: verified_secondary
          refs: [dasuquin_cat_label]
      sul: {value: null}

  - id: curcumin
    name: "Curcumin / curcuminoids (Curcuma longa)"
    dog:
      dose_basis: mg_per_kg_0.75
      doses:
        - need: osteoarthritis
          target: 0.43
          unit: "g curcuma extract (18-22% curcuminoids) per 1,000 kcal of diet, i.e. ~41 mg extract/kg^0.75/day (~7-9 mg curcuminoids/kg^0.75) at MER 95 kcal/kg^0.75; combined with hydrolysed collagen + green tea"
          status: derived
          refs: [comblain_2017]
      bioavailability_caveat: >
        Very poor oral bioavailability. In beagles, unformulated curcumin at 150 mg/kg reached
        Cmax only 4.22 ng/mL at 40 min, then fell rapidly; a solid dispersion raised Cmax
        ~15-fold, and a phospholipid complex gave 196% relative bioavailability (Song 2022). Human
        review: Anand 2007. mg of 'turmeric' or 'curcumin' is not comparable across formulations;
        record the formulation (phytosome, solid dispersion, piperine, nanoparticle) as part of the dose.
      sul: {value: null, status: verified, note: "none established"}
      adverse_effects_high_dose: ["GI upset; theoretical antiplatelet/drug interactions (unverified for dogs)"]
      refs: [song_2022, anand_2007, comblain_2016]
    cat:
      dose_basis: unverified
      doses: [{need: osteoarthritis, status: unverified, notes: "Only within combination product (Corbee 2022). Cats have limited glucuronidation capacity; curcumin is extensively glucuronidated, so caution (theoretical, unverified)."}]
      sul: {value: null}
      refs: [corbee_2022]

  - id: boswellia_serrata
    name: "Boswellia serrata resin extract"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: osteoarthritis_inflammatory_joint_spinal
          target: 40
          unit: "mg/kg/day (400 mg/10 kg once daily with food, 6 weeks; extract BSB108, >=50% triterpenic acids)"
          notes: "Open study; 71% overall efficacy after 2 weeks. Only study evaluating Boswellia alone in dogs (Zapata 2023)."
          status: verified
          refs: [reichling_2004, zapata_2023]
      quality_caveat: "Canine products vary enormously: AKBA 0.1-155.7 mg/g in tested products; measured AKBA 114-224% of label (Miscioscia 2019). Dose should be stated as AKBA/KBA content where possible."
      sul: {value: null, status: verified}
      adverse_effects_high_dose: ["Occasional GI signs reported in open study (details not verified)"]
      refs: [miscioscia_2019]
    cat:
      dose_basis: per_weight_band
      doses: [{need: osteoarthritis, status: verified_secondary, notes: "Only as 11 mg/capsule in Dasuquin for Cats; no feline study."}]
      sul: {value: null}
      refs: [dasuquin_cat_label]

  - id: hyaluronic_acid
    name: "Hyaluronic acid (oral)"
    dog:
      dose_basis: per_weight_band
      doses:
        - need: post_TTA_stifle_osteoarthritis
          bands: {"<=26 kg": "27 mg HA once daily", ">26 kg": "54 mg HA once daily"}
          derived_mg_per_kg: "~1-2+ mg/kg/day (e.g. 1.0 mg/kg at 26 kg; 1.35 mg/kg at 40 kg)"
          notes: "Rooster-comb HMW HA (Mobilee), 10 weeks; improved synovial HA and PON-1 biomarkers."
          status: verified
          refs: [serra_aguado_2021]
      sul: {value: null, status: verified}
      adverse_effects_high_dose: ["None reported (unverified)"]
    cat:
      dose_basis: unverified
      doses: [{need: joint_or_skin, status: unverified}]
      sul: {value: null}

  - id: eggshell_membrane
    name: "Natural eggshell membrane (NEM)"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: joint_function_osteoarthritis
          target: 13.5
          unit: "mg/kg/day (6 mg/lb) once daily, 6 weeks"
          notes: "No serious adverse events; manufacturer-sponsored. Muller 2019 (pilot, combination product) and Ragetly 2025 used combination supplements."
          status: verified
          refs: [ruff_2016, muller_2019, ragetly_2025]
      sul: {value: null, status: verified}
      adverse_effects_high_dose: ["None serious reported at 13.5 mg/kg; egg allergy theoretical"]
    cat:
      dose_basis: unverified
      doses: [{need: skin_coat, status: unverified, notes: "Ragdoll cat study with sodium hyaluronate + eggshell membrane (Chen 2026); dose not extracted."}]
      sul: {value: null}

  - id: same
    name: "S-adenosylmethionine (SAMe)"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: chronic_hepatitis_hepatoprotection
          target: 20
          unit: "mg/kg PO q24h on an empty stomach (butanedisulfonate or tosylate salts); phytate salt 8-10 mg/kg q24h (text: 5-10 mg/kg)"
          status: verified
          refs: [acvim_chronic_hepatitis_2019]
        - need: glucocorticoid_vacuolar_hepatopathy
          target: 20
          unit: "mg/kg/day divided BID (with prednisolone 2.2 mg/kg)"
          status: verified
          refs: [center_2005_dogs]
        - need: age_related_cognitive_decline
          target: 18
          unit: "mg/kg/day SAMe tosylate, 8 weeks"
          status: verified
          refs: [reme_2008]
      sul: {value: null, status: verified, note: "none established"}
      adverse_effects_high_dose: ["Rare nausea (ACVIM table)"]
      adverse_refs: [acvim_chronic_hepatitis_2019]
      product_weight_bands:
        - product: "Denamarin tablets (Nutramax; SAMe + silybin-PC)"
          strengths: {"small (cats & dogs <=12 lb)": "SAMe 90 mg + SPC 31 mg (9 mg silybin A+B)", "medium (13-34 lb)": "SAMe 225 mg + SPC 82 mg (24 mg silybin)", "large (35+ lb)": "SAMe 425 mg + SPC 120 mg (35 mg silybin)"}
          bands: {"<=12 lb": "1 small", "13-34 lb": "1 medium", "35-65 lb": "1 large", "66-120 lb": "2 large", ">120 lb": "3 large"}
          derived_mg_per_kg: "SAMe ~13-30 mg/kg/day across bands (e.g. 35-65 lb = 14-27 mg/kg) - consistent with the 20 mg/kg consensus"
          administration: "Empty stomach, >=1 h before a meal"
          status: verified_secondary
          refs: [denamarin_label]
    cat:
      dose_basis: per_animal_fixed
      doses:
        - need: hepatoprotection
          target: 90
          unit: "mg SAMe/cat/day (Denamarin small tablet; ~18-30 mg/kg for 3-5 kg cats, derived)"
          status: verified_secondary
          refs: [denamarin_label]
        - need: safety_reference
          target: 48
          unit: "mg/kg PO q24h for 113 days in 15 healthy cats (enteric-coated butanedisulfonate); increased hepatic GSH, no adverse findings reported in abstract"
          status: verified
          refs: [center_2005_cats]
      sul: {value: null, status: verified}
      adverse_effects_high_dose: ["None reported at 48 mg/kg/day x 113 d (abstract); rare nausea"]

  - id: silybin
    name: "Silybin (silibinin) - preferably silybin-phosphatidylcholine complex (SPC)"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: chronic_hepatitis_hepatoprotection
          min: 0.7
          max: 6
          unit: "mg silybin/kg/day PO once daily as PC complex (dose 'not well defined')"
          status: verified
          refs: [acvim_chronic_hepatitis_2019]
        - need: chronic_hepatitis_native_extract
          min: 4
          max: 8
          unit: "mg/kg/day silymarin native extract divided 2-3 times daily ('largely undefined')"
          status: verified
          refs: [acvim_chronic_hepatitis_2019]
        - need: CCNU_hepatotoxicity_prevention
          notes: "Denamarin (SAMe+silybin) reduced CCNU-associated liver enzyme increases (Skorupski 2011); doses per label bands."
          status: verified
