          refs: [maggs_2003]
        - need: evidence_summary
          notes: "Systematic review: lysine is not effective for prevention or treatment of FHV-1; dietary supplementation at 51 g/kg diet was associated with more FHV-1 DNA detection and lower plasma arginine (Maggs 2007)."
          status: verified
          refs: [bol_bunnik_2015, maggs_2007, drazenovich_2009]
      sul: {value: null}
      adverse_effects_high_dose: ["Lysine-arginine antagonism (lower plasma arginine at high dietary lysine); possible worsening of URD in shelter cats"]

  - id: beta_glucan
    name: "Beta-glucan (yeast beta-1,3/1,6-glucan; mushroom/seaweed)"
    dog:
      dose_basis: mg_per_kg
      doses:
        - need: immune_gut_support_puppies
          target: 65
          unit: "mg/kg/day purified S. cerevisiae beta-1,3/1,6-glucan for 120 days"
          status: verified
          refs: [de_souza_2025]
        - need: adult_dogs_functional
          min: 15
          max: 30
          unit: "mg beta-glucan/kg/day (yeast 0.115% or seaweed 0.155-0.310% of diet)"
          status: verified
          refs: [theodoro_2026]
        - need: mucosal_immunity
          target: "150 mg/dog/day (MacroGard tablets, 4 weeks)"
          status: verified
          refs: [stuyven_2010]
        - need: vaccine_response
          target: "0.012-0.023% of kibble"
          status: verified
          refs: [fries_craft_2023]
      sul: {value: null}
      adverse_effects_high_dose: ["Well tolerated; high-dose seaweed beta-glucan delayed postprandial insulin peak (Theodoro 2026)"]
    cat:
      dose_basis: unverified
      doses: [{need: immune, status: unverified}]
      sul: {value: null}

  - id: bovine_colostrum
    name: "Bovine colostrum"
    dog:
      dose_basis: mg_per_kg_0.75   # diet inclusion
      doses:
        - need: immune_vaccine_response
          target: "0.1% spray-dried bovine colostrum in diet"
          status: verified
          refs: [satyaraj_2013]
        - need: post_weaning_faecal_quality_puppies
          notes: "Giffard 2004; inclusion level not extracted."
          status: verified
          refs: [giffard_2004]
        - need: combined_with_mushroom_beta_glucan
          target: "1.8 g/day blend top-dressed (dogs ~9.6 kg)"
          status: verified
          refs: [wang_2026]
      sul: {value: null}
      adverse_effects_high_dose: ["Well tolerated in studies; dairy-protein allergy theoretical"]
      refs: [yu_2025]
    cat:
      dose_basis: unverified
      doses: [{need: immune, status: unverified}]
      sul: {value: null}

  - id: vitamin_d3
    name: "Vitamin D3 (cholecalciferol)"
    dog:
      dose_basis: mg_per_kg_0.75   # limits are per kg DM / per 1000 kcal
      doses:
        - need: supplementation
          notes: "No routine supplemental dose recommended for dogs on complete diets; any supplementation should be vet-directed with 25(OH)D and calcium monitoring. Not to be confused with calcitriol therapy in CKD."
          status: verified_secondary
      sul:
        - {source: "NRC 2006 (via Jewell 2023)", value: "3,200 IU/kg DM (recommended allowance 552-3,200 IU/kg DM)", status: verified_secondary}
        - {source: "AAFCO (via Jewell 2023)", value: "max 3,000 IU/kg DM (reduced from 5,000 IU/kg in 2016)", status: verified_secondary}
        - {source: "FEDIAF 2025", value: "nutritional max 320 IU/100 g DM (= 3,200 IU/kg DM; 800 IU/1,000 kcal); EU legal max 227 IU/100 g DM", status: verified}
        - {source: "FEDIAF 2025 rationale", value: "435 IU/100 g DM affected Ca absorption/ossification in Great Dane puppies; 425 IU/100 g DM considered safe for small-breed puppies; same max applied to adults for lack of data", status: verified}
        - {source: "Jewell & Panickar 2023 (Hill's)", value: "food at 9,992.5 IU/kg for 26 weeks: no observable adverse effects in adult dogs", status: verified}
      adverse_effects_high_dose:
        - "Hypercalcaemia, hyperphosphataemia, PU/PD, vomiting, anorexia, acute kidney injury, soft-tissue mineralisation"
        - "Acute cholecalciferol toxicosis: signs reported from 0.1 mg/kg (~4,000 IU/kg) and toxicosis at 0.5 mg/kg (~20,000 IU/kg) (MSD/Merck Vet Manual)"
      recall_context: "Hill's canned dog food recall for excessive vitamin D (supplier error): initiated late Jan 2019, expanded 20 Mar 2019 to 85 lots of 33 varieties (~1.08 million cases / 21.6 million cans); products bought 1 Sep 2018-21 Mar 2019."
      adverse_refs: [merck_vet_cholecalciferol, avma_hills_recall_2019]
    cat:
      dose_basis: mg_per_kg_0.75
      doses:
        - need: supplementation
          notes: "No routine supplemental dose; cats rely entirely on diet (inefficient cutaneous synthesis)."
          status: verified_secondary
          refs: [vecchiato_2021]
      sul:
        - {source: "FEDIAF 2025", value: "nutritional max 3,000 IU/100 g DM (30,000 IU/kg DM; 7,500 IU/1,000 kcal), based on Sih 2001; EU legal max 227 IU/100 g DM", status: verified}
        - {source: "NRC 2006 (as applied in Vecchiato 2021)", value: "per-cat SUL ~1,900 IU/day for a 4 kg adult cat eating 253 kcal (~7,500 IU/1,000 kcal, derived)", status: derived}
        - {source: "AAFCO", value: "cat max 30,000 IU/kg DM commonly cited", status: unverified}
      adverse_effects_high_dose: ["Acute toxicosis in 5 young cats fed kitten food with 27,300 IU/100 g as fed (>40x NRC SUL): hypercalcaemia, azotaemia, persistent CKD in 2 cats"]
      adverse_refs: [vecchiato_2021]

