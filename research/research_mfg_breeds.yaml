      - {id: hip_dysplasia, strength: moderate, evidence: "OFA registry, Gough & Thomas 2018", status: unverified_numbers}
      - {id: elbow_dysplasia, strength: moderate, evidence: "OFA: about 10.1% ED (birth years 1998-2001)", status: verified_snippet}
      - {id: cranial_cruciate_ligament_rupture, strength: moderate, evidence: "Gough & Thomas 2018; VetCompass (Taylor-Brown FE et al. Vet Surg 2015, PMID 26118493)", status: unverified_numbers}
      - {id: copper_storage_hepatopathy, strength: moderate, evidence: "ATP7B p.Arg1453Gln raises and ATP7A p.Thr327Ile partly lowers hepatic copper (Fieten H et al. Dis Model Mech 2016)", status: verified_snippet}
      - {id: atopic_dermatitis, strength: moderate, evidence: "MSD Vet Manual breed list", status: verified_snippet}
      - {id: cystinuria, strength: weak, evidence: "Type I-A (SLC3A1) reported in Labradors; UC Davis VGL test https://vgl.ucdavis.edu/test/cystinuria-type-ia-labrador", status: verified_snippet}
