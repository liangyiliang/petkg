# Research: manufacturability (Part A) and breed predispositions (Part B)
# For the pet supplement knowledge graph (dogs and cats).
# Compiled 2026-10-03.
#
# What the status labels mean (each value carries one):
#   verified          - I read the number or claim myself on the cited page/PDF.
#   verified_snippet  - the number came from a web-search summary of the named source;
#                       I did not open the full text. Medium confidence; check before using as a hard limit.
#   rule_of_thumb     - industry practice or product-label pattern, not a standard;
#                       the source is named.
#   unverified        - general formulation or veterinary knowledge; I checked no source
#                       in this session. Do not use as a hard constraint without checking.
# Citations from memory (author/year/journal not re-checked this session) are tagged
# "citation_from_memory: true".

meta:
  version: 1
  scope: [dog, cat]
  jurisdiction_for_regulatory: US
  caveat: >
    Dosage-form limits are engineering ranges taken from patents, excipient-maker case studies
    and commercial labels. They are not regulatory limits. Contract manufacturers seldom
    publish chew weights, maximum loads or MOQs, so most MOQ fields are unverified.

# =====================================================================================
# PART A - MANUFACTURABILITY
# =====================================================================================

dosage_forms:

  soft_chew:
    description: Dough of starch/flour absorption base + humectant (glycerin) + palatant + oil/lecithin + actives, formed by cold-feed extrusion, cold forming or thermal extrusion, then cured.
    unit_mass_g:
      typical_range: [2.0, 7.5]
      status: rule_of_thumb
      evidence:
        - {value_g: 2.5, what: "Colorcon glucosamine/MSM veterinary soft chew case study, final chew weight", status: verified, source: "https://www.colorcon.com/hubfs/Formulating%20Veterinary%20Soft%20Chews%20for%20Texture%20and%20Palatability%20Case%20Study.pdf"}
        - {value_g: 7.2, what: "Adroitin-M Soft Chews (TRP Advanced Soft Chew Technology), per-chew weight", status: verified_snippet, source: "https://drugs.com/vet/adroitin-m-soft-chews.html"}
        - {value_g: 3.0, what: "retail soft chew, 60 chews per 180 g container", status: verified_snippet, source: "search result summary (PetDine / retail listings); product not identified"}
      cat_note: "Cat products are usually sold as 'bite-sized' chews (e.g., Probiotic Daily Cat bite-sized soft chew). I found no published unit mass; assume about 1-2 g (unverified)."
    max_active_load_pct:
      practical_ceiling: 35
      status: rule_of_thumb
      rationale: >
        The binder/absorption base (about 35% starch), humectant (about 11% glycerin), palatant
        (about 5%), lecithin (about 4%), oil and water take up about 60-65% of the mass. The chew
        has to stay cohesive, chewable and palatable, and must not harden or crack as it cures.
      evidence:
        - {value_pct: 36.5, what: "Colorcon Formulation 1: glucosamine HCl 22.45% + MSM 14.03%; Starch 1500 35.90%; vegetable glycerin 10.83%; Palasurance palatant 5.00%; salmon oil 3.50%; sunflower lecithin 4.00%; water 3.69%; Previon 0.60%", status: verified, source: "Colorcon case study PDF (above)"}
        - {value_pct: 30.0, what: "Colorcon Formulation 2: glucosamine 19.48% + MSM 10.50% with 10% salmon oil", status: verified, source: "Colorcon case study PDF (above)"}
        - {range_pct: [0.1, 25], what: "active agent range claimed in a low-water-activity soft chew patent", status: verified, source: "US 12,194,144 B2 https://patents.google.com/patent/US12194144B2/en"}
        - {range_pct: [0.01, 20], what: "active range in a soft chewable veterinary formulation patent application; starch 2-50%, carbohydrates 5-25%, flavour 5-15%", status: verified_snippet, source: "https://patents.justia.com/patent/20200030232 (Starch-Free Soft Chew for Veterinary Applications) / related family"}
      model_hint: "Use 35% w/w of chew mass as the default actives ceiling, and flag above 40% as 'needs manufacturer feasibility'."
    max_oil_load_pct:
      practical_range: [3.5, 10]
      status: verified
      source: "Colorcon case study (salmon oil 3.5% and 10%; the starch grade was varied to absorb the oil)"
      note: "Emulsion-type chewable patents claim an omega-3 oil phase of 5-75% of the unit, about 40% in one example (US 10,383,818 / 11,123,288 'Emulsion', verified_snippet). That is a gelled chewable rather than a typical starch-based soft chew. Above about 10% oil, expect texture and oil-weeping problems (rule_of_thumb)."
    processing:
      cold_feed_extrusion:
        temperature: "ambient; no added steam; cured on racks about 24 h before packaging (Colorcon)"
        status: verified
        source: "Colorcon case study; https://www.petfoodprocessing.net/articles/14069-taking-the-heat-off-pet-food-treats-with-cold-extrusion-applications (cold extrusion at ambient temperature, no water; verified_snippet)"
      thermal_extrusion:
        temperature_c: [60, 95]
        note: "Pre-mix preconditioned with humectant, water and steam (about 26%) for a partial cook (patent description, verified_snippet). Kills non-spore probiotics and stresses heat-labile actives."
        status: verified_snippet
        source: "USPTO patent full text retrieved via search (soft chew / pet chew family, e.g., US 12,075,799 / 11,766,051)"
      low_aw_hot_melt_then_cool:
        temperature_c: "non-aqueous carrier heated to at least 50 C (up to 100 C), cooled to 30-40 C before heat-labile actives are added"
        status: verified
        source: "US 12,194,144 B2"
      baked:
        note: "Some contract makers (e.g., Bimini Pet Health) list 'baked goods' as a form. Baking temperatures are not published; treat as high heat (unverified)."
        source: "https://www.nasc.cc/preferred-suppliers/bimini-pet-health/"
    water_activity:
      conventional: "> 0.6"
      low_aw_target: "<= 0.6; patent example about 0.30 or below"
      pet_chew_patent_preferred_range: [0.60, 0.80]
      moisture_pct_range: [10, 20]
      status: verified
      source: "US 12,194,144 B2 (aw); pet chew patents retrieved via search for moisture 10-20% and aw 0.60-0.75 preferred (verified_snippet)"
      implication: "At aw above about 0.6, moisture-labile actives (probiotics, SAMe, some vitamins) degrade, and microbial growth must be controlled with glycerin/propylene glycol humectants and preservatives (US 12,194,144)."
    shelf_life:
      typical_months: [12, 24]
      status: rule_of_thumb
      evidence: "Patents cite at least 12 months for shelf-stable chewables. One supplier listing states 2 years."
      issues: [texture hardening on curing/aging (Colorcon tracked days 0-60), oil oxidation/rancidity, probiotic CFU loss, Maillard browning, mould if aw is high]
    palatability: "Palatant needed (about 5% in Colorcon; 5-15% flavour in patents). Bitter actives (MSM, curcumin, some botanicals) and fishy oils need masking."
    species_suitability: {dog: high, cat: "low-moderate; cats are selective, so use a small bite-size chew with a strong animal-digest palatant (rule_of_thumb)"}
    moq_notes:
      - {note: "Bewdley LLC (contract maker, TX) advertises 'low MOQs'; no number published", source: "https://www.nasc.cc/preferred-suppliers/bewdley-llc/", status: verified_snippet}
      - {note: "One overseas private-label listing gives a soft chew MOQ of 700 kg and a 2-year shelf life", source: "https://attendees.supplysideshow.com/event/supplyside-west-2024/product/UHJvZHVjdF8xMTYxODY5", status: verified_snippet}
      - {note: "Catalent: cold-process soft chews, 'high active dose loading', pilot to commercial scale; specs only on request", source: "https://www.catalent.com/self-care/dietary-supplements/manufacturing/soft-chews", status: verified}
    incompatible_with: [SAMe_tosylate (enteric coating required), non_spore_probiotics (unless cold process + low aw), very_high_dose_bulk_fibres (psyllium swells), oil_loads_above_about_10pct]

  chewable_tablet:
    description: Directly compressed or granulated flavoured tablet (liver/pork flavour). Can be scored for splitting.
    unit_mass_g: {typical_range: [0.5, 5.0], status: unverified, note: "No published tablet weights found for Dasuquin, Cosequin or Nutri-Vet in this session."}
    max_active_load_pct: {typical: [50, 80], status: unverified, rationale: "Needs no oil phase or humectant. Binder, flow aid, lubricant and flavour (about 15-30%) set the ceiling. Compressibility of the actives is the main limit."}
    commercial_examples:
      - {product: "Dasuquin chewable tablets small/medium dog", actives_mg: {glucosamine_hcl: 600, sodium_chondroitin_sulfate: 250, ASU: 45}, status: verified_snippet, source: "https://www.vetuk.co.uk/dog-supplements-cat-supplements-joint-supplements-c-5_4/dasuquin-chewable-tablets-for-dogs-p-20976"}
      - {product: "Dasuquin chewable tablets large dog", actives_mg: {glucosamine_hcl: 900, sodium_chondroitin_sulfate: 350, ASU: 90}, status: verified_snippet, source: "same"}
      - {product: "Anxitane (Virbac) L-theanine chewable", strengths_mg: [50, 100], dosing: "cats & dogs <22 lb: 1/2 tablet BID (tablet is split)", status: verified_snippet, source: "https://vet-us.virbac.com/home/products/behavior/anxitane-l-theanine-chewable-tab.html"}
      - {product: "Marin for dogs (silybin phytosome) chewable tablet", silybin_mg: 43, status: verified_snippet, source: "https://drugs.com/vet/marin-for-cats.html / vetrxdirect listing"}
    processing: {temperature: "ambient; compression causes only slight friction heating (unverified)", moisture: "low; dry granulation or direct compression preferred for moisture-sensitive actives (unverified)"}
    shelf_life: {typical_months: [24, 36], status: unverified}
    palatability: "Flavoured tablets are accepted by many dogs. Cats often refuse tablets."
    species_suitability: {dog: high, cat: "low-moderate (half tablet for small cats, as with Anxitane)"}
    incompatible_with: [oils above a few % (tablets soften), SAMe unless enteric-coated non-chewable]

  capsule:
    description: Hard two-piece gelatin or HPMC capsule. Can be swallowed (pilled) or opened.
    capsule_size_table:
      status: verified_snippet
      source: "Capsugel/Lonza Coni-Snap capsule size chart https://www.capsugel.com/cpsl-web/kc/Coni-Snap®-Gelatin-Capsule-Sizes.pdf"
      volumes_ml: {"000": 1.37, "00": 0.95, "0": 0.68, "1": 0.50, "2": 0.37, "3": 0.30, "4": 0.21, "5": 0.13}
      fill_mg_at_density: {"0.6_g_per_ml": {"000": 822, "5": 78}, "0.8_g_per_ml": {"000": 1096, "5": 104}, "1.0_g_per_ml": {"000": 1370, "5": 130}, "1.2_g_per_ml": {"000": 1644, "5": 156}}
      formula: "fill_mg = volume_ml x tapped_density_g_per_ml x 1000"
    unit_mass_g: {typical_range: [0.1, 1.4], status: verified_snippet, basis: "size table x density"}
    max_active_load_pct: {typical: [90, 99], status: rule_of_thumb, rationale: "Only a flow agent (silica, Mg stearate) and sometimes a filler are needed."}
    processing: {temperature: ambient, moisture: "gelatin shells hold about 13-16% water and can dry out or soften with hygroscopic fills; HPMC is better for hygroscopic fills (unverified)"}
    shelf_life: {typical_months: [24, 36], status: unverified}
    species_suitability: {dog: "moderate (pilling or hiding in food)", cat: "low if pilled. In the Taylor 2022 survey (JFMS, doi:10.1177/1098612X221083752), 78.7% of owners reported the cat spitting out tablets, 77.0% biting/scratching, 71.7% refusing medication in food, and 53.0% preferred liquids (verified_snippet)"}

  sprinkle_capsule:
    description: Capsule designed to be opened and sprinkled on food. Pilling is not required.
    unit_fill_mg_typical: [100, 500]
    status: rule_of_thumb
    commercial_examples:
      - {product: "Cosequin for Cats sprinkle capsule", per_capsule_mg: {glucosamine_hcl: 125, sodium_chondroitin_sulfate_bovine: 100, manganese: 1}, dosing: "<=10 lb: 1 cap/day for 4-6 wk then every other day; >10 lb: 2 caps/day then 1/day", status: verified_snippet, source: "https://drugs.com/vet/cosequin-for-cats.html"}
      - {product: "Zylkene (alpha-casozepine) capsules", strengths_mg: [75, 225, 450], note: "Palatable water-soluble powder. Give whole or open and mix with food. Example: 75 mg for 0-5 kg.", status: verified_snippet, source: "https://www.drugs.com/vet/zylkene-75-mg.html"}
    palatability_constraint: "Contents must be near taste/odour-neutral or palatable on food. Bitter (MSM, curcumin), pungent (garlic) or fishy powders lower acceptance, especially in cats (unverified)."
    species_suitability: {dog: moderate, cat: "high (preferred non-pill route for cats)"}

  powder_sachet:
    aliases: [scoop_powder, top_dress_powder]
    unit_mass_g: {typical_range: [0.5, 5.0], status: rule_of_thumb, examples: ["FortiFlora 1 g sachet", "Epakitin 1 g per 5 kg BID scoop"]}
    max_active_load_pct: {typical: [10, 100], status: rule_of_thumb, note: "Probiotic sachets are mostly palatant/carrier (FortiFlora is a probiotic plus animal digest palatant). Single-ingredient scoop powders can be about 100% active."}
    commercial_examples:
      - {product: "Purina Pro Plan FortiFlora", active: "Enterococcus faecium SF68 (NCIMB 10415, EU 4b1705)", cfu: "1 x 10^8 CFU per 1 g sachet (some markets state 5 x 10^8 CFU/g)", storage: "2-25 C", status: verified_snippet, source: "https://vetcentre.purina.co.uk/sites/default/files/vet_materials/fortiflora_vet_sales_presenter_2024.pdf"}
      - {product: "Epakitin (phosphate binder)", composition: "10% calcium carbonate, 8% chitosan, lactose, hydrolysed soy protein", dose: "1 g per 5 kg BW BID with food", status: verified_snippet, source: "https://cats.com/?p=38367 (secondary)"}
    processing: {temperature: "ambient blending", moisture: "low-moisture blend; foil sachets protect hygroscopic and probiotic contents (rule_of_thumb)"}
    species_suitability: {dog: high, cat: "high if palatable; a large volume on food causes refusal (rule_of_thumb)"}
    dose_volume_limit_note: "A powder dose should be small relative to a meal. Cats eat about 50-80 g dry food per day (unverified), so multi-gram scoops of bulky actives (psyllium, glucosamine at canine doses) are unrealistic for cats."

  liquid_oil:
    aliases: [pump_oil, liquid]
    unit_volume_ml: {examples: [5.0, 6.0], note: "Nordic Naturals Omega-3 Pet doses by teaspoon (5 mL); Welactin canine uses a 6 mL scoop; Welactin feline ships with a pump. Pump stroke volume not verified (often about 1-2 mL, unverified)."}
    commercial_examples:
      - {product: "Nordic Naturals Omega-3 Pet liquid", spec: "EPA >=16%, DHA >=11%; 1 tsp (5 mL) gives 736 mg EPA + 506 mg DHA", status: verified_snippet, source: "https://www.cheshirehorse.com/p/nordic-naturals-omega-3-pet-supplement---liquid/KW79237.html"}
      - {product: "Welactin Canine", spec: "per 6 mL scoop: total omega-3 >=1770 mg, EPA >=870 mg, DHA >=570 mg", status: verified_snippet, source: "https://www.vetrxdirect.com/product/view/welactin-canine-for-dogs-otc"}
    max_active_load_pct: {typical: [95, 100], status: rule_of_thumb, note: "Oil is the active. Antioxidant (mixed tocopherols, rosemary) and flavour make up the rest."}
    processing: {temperature: ambient, oxygen: "nitrogen flush and opaque bottle; oxidation rises after opening (rule_of_thumb)"}
    shelf_life: {unopened_months: [18, 24], after_opening: "often labelled to use within about 1-3 months, refrigerated (unverified)"}
    palatability: "Dogs usually accept fish oil on food. For cats, an atenolol formulation study and the Taylor 2022 survey favour liquids/suspensions over tablets. Oil-based flavours were reported as better accepted than water-based (search summary; primary source not identified, unverified)."
    species_suitability: {dog: high, cat: "high (liquids preferred by 53% of cat owners, Taylor 2022)"}
    compatible_actives: [fish_oil, krill_oil, algal_DHA_oil, MCT_oil, vitamin_E, CoQ10 (dissolved in oil), PCSO-524 (diluted in oil)]

  softgel:
    unit_mass_g: {typical_range: [0.2, 1.6], status: rule_of_thumb, evidence: "1000 mg fish-oil softgel, size 20 oblong, total mass about 1337 mg (third-party COA, verified_snippet)"}
    max_active_load_pct: {typical: [70, 80], basis: "fill / total mass (1000/1337 = 75%)", status: verified_snippet}
    processing:
      shell_moisture: "newly formed softgels hold 35-40% w/w water, dried to about 20-25% and then 10-15% (verified_snippet, supplysidesj.com 'Achieving Equilibrium in Softgel Encapsulation')"
      fill_constraints: "Hydrophobic oils are ideal. Water-soluble or hygroscopic fills migrate into the shell and cause softening/leaking. Aldehydes and oxidised oils cross-link gelatin (rule_of_thumb)."
      temperature: "gelatin ribbons are warm (about 60 C, unverified); fill handled near ambient (unverified)"
    commercial_examples:
      - {product: "Antinol (PCSO-524) softgel", spec: "50 mg PCSO-524 green-lipped mussel oil per softgel in olive oil, d-alpha-tocopherol, gelatin, glycerin", dosing: "<20 kg: 2/day for 15 days then 1/day; >20 kg: 4/day then 2/day", status: verified_snippet, source: "https://www.vetrxdirect.com/product/view/antinol-joint-supplement-for-dogs-cats-otc"}
    species_suitability: {dog: "high (swallowed or chewed)", cat: "low as a whole unit; moderate if pierced and squeezed onto food (unverified)"}

# -------------------------------------------------------------------------------------
ingredients:

  fish_oil:
    physical_form: liquid oil (TG or EE); also microencapsulated powder
    standardization:
      - {grade: "18/12 natural TG", spec: "18% EPA, 12% DHA (about 30% EPA+DHA)", note: "Mostly anchovy (Engraulis ringens), self-affirmed GRAS, precursor for most concentrates", status: verified_snippet, source: "https://bulknaturaloils.com/fish-oil-18-epa-12-dha-1-0-m2100-m2100.html (Jedwards)"}
      - {grade: "concentrate rTG/EE", spec: "commonly about 50-70% total omega-3 (e.g., '60% rTG')", status: unverified}
      - {grade: "salmon oil (pet)", spec: "Nordic Naturals Omega-3 Pet: EPA >=16% DHA >=11%", status: verified_snippet}
    oxidation_limits_GOED: {PV_meq_per_kg_max: 5, pAV_max: 20, TOTOX_max: 26, acid_value_mg_KOH_per_g_max: 3, formula: "TOTOX = 2*PV + pAV", status: verified_snippet, source: "GOED Voluntary Monograph https://goedomega3.com/storage/app/media/Governance docs/GOED Monograph - 2022 01 06.pdf"}
    heat_sensitivity: high (PUFA oxidation accelerates with heat/oxygen/light)
    moisture_sensitivity: low (but water + metal ions speed oxidation)
    antioxidant_required: "Mixed tocopherols and/or rosemary extract are the industry norm. Iron and copper ions sharply reduce fish-oil oxidative stability, with Fe3+ a stronger pro-oxidant than Cu2+ (verified_snippet; e.g., UBC thesis https://open.library.ubc.ca/cIRcle/collections/831/items/1.0091636)"
    taste_odour: fishy odour/aftertaste; dogs/cats generally accept, humans object
    max_load_in_soft_chew_pct: "3.5-10% (Colorcon, verified). Above about 10% needs a special absorption base."
    incompatible_with: [iron_salts, copper_salts (pro-oxidant in the same matrix), high_heat_processing, oxygen_exposure]
    compatible_forms: [liquid_oil, softgel, soft_chew (<=10% oil), powder_sachet (as microencapsulated powder), sprinkle_capsule (powder form)]
    safety_note: "Dose-dependent GI upset, platelet effects and vitamin E depletion are reported in the literature (unverified here; see the dosing research file)."

  krill_oil:
    physical_form: viscous red oil (phospholipid-bound omega-3 + astaxanthin)
    standardization:
      - {spec: "phospholipids >=40% w/w, omega-3 >=15% w/w, contains astaxanthin", status: verified_snippet, source: "US patent 8,383,675 (natural marine phospholipids)"}
      - {spec: "QRILL Pet (krill meal) fat fraction: about 40% phospholipids, about 25% omega-3 (about 11% EPA, about 7% DHA), about 114 ppm astaxanthin", status: verified_snippet, source: "Aker QRILL Pet product information via search"}
    heat_sensitivity: moderate-high (astaxanthin is a natural antioxidant but degrades with heat/light)
    taste_odour: shrimp/fishy; less 'fish burp' than fish oil (unverified)
    allergen_note: shellfish/crustacean
    compatible_forms: [softgel, liquid_oil, soft_chew]
    soft_chew_example: "Full Strength Krill Soft Chews (https://drugs.com/vet/full-strength-krill-soft-chews.html)"
    note: "Omega-3 per gram is lower than fish-oil concentrates, so large doses need many units."

  algal_dha_oil:
    physical_form: oil (Schizochytrium sp.); also algal powder
    standardization: {spec: "DHA >=40.5% (>=350 mg/g), EPA <=3% for common grades; pet algal powders 40-50% DHA claimed", status: verified_snippet, source: "TGA compositional guideline https://www.tga.gov.au/sites/default/files/cm-cg-dha-rich-oil-derived-from-microalgae-schizochytrium.pdf"}
    heat_sensitivity: high (as for fish oil)
    note: "Mostly DHA with little EPA, so it does not substitute for EPA-targeted joint/anti-inflammatory dosing. Vegan/sustainability claim."
    compatible_forms: [softgel, liquid_oil, soft_chew]

  glucosamine_hcl:
    physical_form: white crystalline powder, freely water soluble
    potency: {glucosamine_base_pct: 83, purity: ">=98-99%", status: verified_snippet, source: "https://www.nutriavenue.com/nn/glucosamine-hcl-vs-glucosamine-sulfate/ (secondary); stoichiometry: MW glucosamine 179.2 / glucosamine HCl 215.6 = 0.831 (my calculation)"}
    heat_sensitivity: low-moderate (Maillard browning with reducing sugars/proteins at heat; unverified)
    moisture_sensitivity: low (not very hygroscopic, unverified)
    taste: slightly salty/sweet; acceptable
    sources: [shellfish (crab/shrimp), corn fermentation (vegetarian)]
    compatible_forms: [soft_chew, chewable_tablet, capsule, sprinkle_capsule, powder_sachet]

  glucosamine_sulfate:
    physical_form: powder stabilised with KCl or NaCl (pure sulfate is hygroscopic/unstable)
    potency:
      - {form: "glucosamine sulfate 2KCl", note: "about 74% glucosamine sulfate + about 26% KCl stabiliser. One secondary source gives about 47.8% 'active glucosamine' vs 81.3% for HCl; exact numbers depend on the salt", status: verified_snippet, source: "https://www.nutriavenue.com/nn/glucosamine-hcl-vs-glucosamine-sulfate/ ; US 5,843,923 (GS-KCl process)"}
      - {calc: "glucosamine base fraction of (GlcN)2.H2SO4 = 2x179.2/456.4 = 0.785 before the KCl/NaCl diluent; with 2KCl (MW 605.5) = 0.59; with 2NaCl (MW 573.3) = 0.63", status: "derived (stoichiometric calculation, not a vendor spec)"}
    moisture_sensitivity: high (reason for the salt stabiliser)
    model_hint: "Store a 'glucosamine_base_fraction' per salt form: HCl 0.83, sulfate-2KCl 0.59, sulfate-2NaCl 0.63 (derived)."
    compatible_forms: [capsule, chewable_tablet, powder_sachet, soft_chew]

  chondroitin_sulfate:
    physical_form: off-white hygroscopic powder (sodium salt)
    standardization: {spec: "USP: 90-105% by CPC titration (the CPC method is non-specific; other GAGs respond too, and high-MW material reads lower)", status: verified_snippet, source: "https://zpd.dk/hubfs/ZPD%20Product%20Presentation%20USP-2.pdf ; NASC-posted CoA https://nasc.cc/wp-content/uploads/2016/10/AIDP_COA_CS20160811.pdf"}
    sources: [bovine trachea, porcine, chicken (sternal) cartilage, shark cartilage]
    molecular_weight: "about 10-15 kDa typical bovine (verified_snippet); shark and chicken differ"
    quality_issue: "Adulteration/mislabelling is common in chondroitin. Specify an HPLC/enzymatic assay, not CPC alone (unverified recommendation)."
    moisture_sensitivity: moderate-high (hygroscopic, unverified)
    heat_sensitivity: low
    compatible_forms: [soft_chew, chewable_tablet, capsule, sprinkle_capsule, powder_sachet]

  green_lipped_mussel_powder:
    physical_form: freeze-dried whole-meat powder (Perna canaliculus)
    composition: "One supplier spec: protein >60%, total fat >10%, GAGs >4% (verified_snippet, greenjeeva.com). Another product: fat 2.4 g/100 g. Composition varies widely by process and harvest."
    heat_sensitivity: "high for bioactivity (freeze-drying preferred; heat-dried powders are reported to lose activity, unverified)"
    taste_odour: strong marine odour; dogs generally accept
    allergen: shellfish
    dose_bulk: "Gram-scale doses limit small-chew and cat use."
    compatible_forms: [soft_chew, chewable_tablet, capsule, powder_sachet]

  green_lipped_mussel_CO2_extract_PCSO524:
    physical_form: oil (supercritical CO2 extract, stabilised, blended in olive oil + vitamin E)
    standard_unit: "50 mg PCSO-524 per softgel (Antinol)"
    status: verified_snippet
    source: "https://www.vetuk.co.uk/antinol-joint-care-pro-soft-gel-capsules-for-dogs-p-50235.html"
    heat_sensitivity: high (extraction is heat-free to protect lipids)
    compatible_forms: [softgel, liquid_oil]
    note: "Doses are mg-scale, unlike gram-scale GLM powder. Do not treat the two as interchangeable on a mg basis."

  UC_II_undenatured_type_II_collagen:
    physical_form: powder from chicken sternum cartilage
    ingredient_dose_vs_active:
      - {statement: "40 mg UC-II delivered 1.2 mg undenatured type II collagen by a newly developed, validated extraction-ELISA", status: verified, source: "Lugo JP et al. Nutr J 2016;15:14. doi:10.1186/s12937-016-0130-8, PMC4731911"}
      - {statement: "'40 mg UC-II (10 mg collagen type II / min. 3% undenatured type II collagen; Lonza)' fed to Labrador Retrievers", status: verified, source: "Varney JL, Fowler JW, Coon CN. Transl Anim Sci 2021. doi:10.1093/tas/txab084, PMC8191485"}
      - {statement: "Older literature/marketing: '40 mg UC-II contains 10 mg active undenatured collagen'. This reflects the older assay and total type II collagen; it is NOT the current 3% undenatured spec", status: verified_snippet}
      - {statement: "Bioiberica Collavant n2 (a competing native type II collagen): 40 mg/day in supplements, 25 ppm in pet food for dogs", status: verified_snippet, source: "https://www.bioiberica.com/en/products/animal-health/collavant-n2"}
    resolution: "Model: 40 mg UC-II ingredient = about 10 mg type II collagen (25%) = 1.2 mg (3%) undenatured/native type II collagen."
    canine_doses_in_literature: "Gupta et al. 2012 and earlier Deparle 2005 (PMID 16050819) used 10 mg UC-II/day per dog. Stabile 2019 (Vet Sci 6:72, PMC6789547) used 1 tablet/day. Lonza marketing for dogs says 40 mg/day; dose is described as weight-independent (oral-tolerance mechanism) (verified_snippet)."
    heat_sensitivity: "high. Undenatured triple helix is lost on heating/denaturation, so cold processing is required (rule_of_thumb; mechanism consistent with Lonza/Bioiberica claims)"
    compatible_forms: [capsule, chewable_tablet, soft_chew (cold process), powder_sachet]

  MSM:
    physical_form: white crystalline powder (methylsulfonylmethane)
    standardization: "OptiMSM 99.9% purity (distilled) (verified_snippet)"
    heat_sensitivity: low (stable at high temperature, per OptiMSM marketing)
    moisture_sensitivity: low
    taste: slightly bitter
    dose_bulk: high (hundreds of mg to grams), which takes up soft-chew mass (14% of the Colorcon chew)
    compatible_forms: [soft_chew, chewable_tablet, capsule, powder_sachet, liquid (water soluble)]

  curcumin_95:
    physical_form: orange-yellow powder, 95% curcuminoids (curcumin, demethoxy-, bisdemethoxy-)
    bioavailability: poor (low water solubility, rapid conjugation)
    phytosome_form: {spec: "Meriva: curcumin-phosphatidylcholine complex standardised to about 18-22% curcuminoids. 450 mg Meriva gave plasma curcumin similar to 4 g standard extract in a human PK study", status: verified_snippet, source: "https://uk.thorne.com/ingredients/curcumin-phytosome"}
    heat_sensitivity: moderate
    light_sensitivity: "curcumin is photolabile (unverified)"
    taste_colour: bitter, strong staining yellow colour (affects chew appearance)
    cat_note: "Curcumin is a phenolic. Cats lack UGT1A6 glucuronidation (see cat_metabolism). Treat cat use as caution/unverified safety."
    compatible_forms: [capsule, soft_chew, chewable_tablet, powder_sachet]

  SAMe_tosylate:
    physical_form: hygroscopic powder (S-adenosyl-L-methionine disulfate tosylate or 1,4-butanedisulfonate)
    potency: {spec: "800 mg SAMe disulfate tosylate = 400 mg SAMe ion (about 50%); quality specs require >=70% (S,S)-diastereomer", status: verified_snippet, source: "https://www.vitasave.ca/products/same-400-mg-1 (AOR label)"}
    moisture_sensitivity: very high. Methacrylic enteric-coated tablets absorb moisture at 25 C/60% RH, the core swells, and contents ooze (patent summary, verified_snippet)
    heat_sensitivity: high
    processing_requirement: "Enteric-coated tablet, made at low temperature/low humidity, sold in individual moisture-resistant blister packs. Denosyl: do not split or crumble; keep in blister until use (verified_snippet, https://www.drugs.com/vet/denosyl-can.html)."
    combination_limit: "The reactive nature of SAMe 'prevents it from being used in combination nutrient products'. It can be stabilised only as a single ingredient with an enteric coat (verified_snippet). Denamarin co-packages SAMe + silybin-PC in one enteric-coated tablet, so the combination is possible in a coated tablet format (verified_snippet)."
    commercial_strengths: "Denosyl 90/225/425 mg. Denamarin: 90 mg SAMe + 31 mg SPC (9 mg silybin A+B) cats/small dogs; 225 mg + 82 mg SPC (24 mg silybin); 425 mg + 120 mg SPC (35 mg silybin)"
    administration: "Given on an empty stomach per label (unverified here)"
    compatible_forms: [enteric_coated_tablet (only)]
    incompatible_forms: [soft_chew, chewable_tablet, powder_sachet, sprinkle_capsule, liquid_oil, capsule (uncoated)]

  silybin_phytosome:
    physical_form: powder (silybin A+B complexed with phosphatidylcholine, e.g., Siliphos)
    standardization: "In Denamarin, 31 mg SPC = 9 mg silybin A+B (about 29%); 82 mg = 24 mg; 120 mg = 35 mg. Marin cats 9 mg silybin per capsule; Marin dogs 43 mg silybin per chewable tablet (verified_snippet)"
    heat_sensitivity: moderate (phospholipid oxidation, unverified)
    compatible_forms: [chewable_tablet, capsule, sprinkle_capsule, coated_tablet (with SAMe)]

  probiotics_lactic_acid_bacteria:
    physical_form: freeze-dried powder (Lactobacillus, Bifidobacterium, Enterococcus faecium SF68)
    heat_sensitivity: "very high. Non-spore strains showed 0% survival in a heat-shock comparison vs >85% for Bacillus coagulans/subtilis (manufacturer claim, petfoodindustry.com, verified_snippet)"
    moisture_sensitivity: "very high. Viability falls quickly when aw is above about 0.25-0.3 (unverified); moisture-labile actives degrade above aw 0.6 (US 12,194,144)"
    overage_practice: "The label CFU is the minimum at end of shelf life, so excess CFU is added at manufacture to cover losses over shelf life (often >12 months) (verified_snippet; PMC7464440, Microorganisms 2020). Overage size is set per strain/matrix from stability data; 2-10x is commonly cited (unverified)."
    packaging: foil sachets, desiccant, blister; some need refrigeration
    incompatible_with: [thermal_extrusion, baking, high_aw_soft_chews, "antimicrobial_botanicals (garlic; oregano/thyme essential oils; high-dose berberine) - plausible, no pet data found (unverified)", "co-administered antibiotics (give 2+ h apart; unverified)"]
    compatible_forms: [powder_sachet, capsule, sprinkle_capsule]

  bacillus_coagulans_spores:
    physical_form: spore powder (e.g., GanedenBC30 / B. coagulans GBI-30, 6086)
    heat_sensitivity: "low. Survives baking, boiling, extrusion and roll-forming; added to petfood before extrusion and survives the full process (verified_snippet, https://www.petfoodindustry.com/articles/680-probiotic-powered-palatants)"
    soft_chew_note: "Described as the only probiotic proven stable long-term in a soft chew (marketing claim, verified_snippet). Example label: 1.2 x 10^8 CFU per chew; recommended 2 x 10^8/day large dogs, 1 x 10^8/day cats/small dogs (product-level, verified_snippet)."
    compatible_forms: [soft_chew, chewable_tablet, powder_sachet, capsule, baked_treat]

  psyllium:
    physical_form: husk powder (Plantago ovata), swelling fibre
    standardization: "Purity grades 85/95/98/99%. Swell volume >=50 mL/g (95%) and >=60 mL/g (98%); moisture <=12% (verified_snippet, girirajpsyllium.in supplier spec)"
    moisture_sensitivity: "high. Gels on contact with water, so it is unsuitable for liquids and problematic in moist soft chew dough (rule_of_thumb)"
    dose_bulk: very high (gram-scale)
    compatible_forms: [powder_sachet, capsule (low dose only), soft_chew (low inclusion)]
    note: "Fibre can bind or slow absorption of co-administered actives/minerals (unverified)."

  L_theanine:
    physical_form: white crystalline powder (synthetic L-theanine e.g., Suntheanine; Anxitane uses a 'pure synthetic form')
    heat_sensitivity: low (unverified)
    moisture_sensitivity: low
    taste: mild umami/sweet, palatable
    commercial: "Anxitane 50 mg and 100 mg chewable tablets (verified_snippet)"
    compatible_forms: [chewable_tablet, soft_chew, capsule, powder_sachet]

  alpha_casozepine:
    physical_form: palatable water-soluble powder (tryptic hydrolysate of bovine alpha-s1 casein, Lactium)
    commercial: "Zylkene 75/225/450 mg capsules. Open and mix with food or treats; label weight bands (e.g., 75 mg for <=5 kg) (verified_snippet)"
    heat_sensitivity: "moderate (peptide; unverified)"
    allergen: milk protein
    compatible_forms: [sprinkle_capsule, capsule, soft_chew, chewable_tablet, powder_sachet]

  melatonin:
    physical_form: powder, potent (mg doses)
    heat_sensitivity: low-moderate (unverified)
    light_sensitivity: "photolabile in solution (unverified)"
    content_uniformity: "Very low dose per unit, so trituration/premix is needed for blend uniformity (rule_of_thumb)"
    safety_formulation: "Never formulate or recommend human gummies/fast-dissolve melatonin that contains xylitol. Xylitol causes hypoglycaemia and liver failure in dogs (FDA: https://www.fda.gov/animal-veterinary/animal-health-literacy/paws-xylitol-toxic-dogs, verified_snippet)."
    compatible_forms: [chewable_tablet, soft_chew, capsule, liquid]

  cranberry_extract_PAC:
    physical_form: red-purple powder
    standardization: "PAC content must name the assay. BL-DMAC is the accepted non-proprietary method. Human clinical reference dose 36 mg PAC/day (DMAC). Example: an extract with 27-33% PAC (DMAC) needs 120 mg for 36 mg PAC (Indena Anthocran) (verified_snippet; https://www.indena.com/indena_files/2021/03/anthocran_ss_us.pdf)"
    assay_warning: "PAC values by the older European Pharmacopoeia or Porter/BL-DMAC methods are not interchangeable. Store the method with the value (verified_snippet)."
    taste: astringent/tart
    hygroscopic: "yes, extract powders cake (unverified)"
    compatible_forms: [soft_chew, chewable_tablet, capsule, powder_sachet]

  chitosan:
    physical_form: powder (deacetylated chitin, crustacean)
    use: "Phosphate binder with calcium carbonate in Epakitin (8% chitosan, 10% CaCO3) (verified_snippet, secondary source)"
    allergen: shellfish
    interaction: "Binds dietary phosphate and possibly fat-soluble vitamins/minerals (unverified). Give with meals."
    compatible_forms: [powder_sachet]

  MCT_oil:
    physical_form: clear liquid oil (C8/C10 triglycerides)
    heat_sensitivity: low (saturated; oxidatively stable)
    dosing_evidence: "Canine epilepsy RCT used MCT at 9% of metabolisable energy (Berk et al. 2020 JVIM, PMID 32293065, verified_snippet). Law et al. 2015 used a 5.5% MCT ketogenic diet."
    tolerability: "GI upset (diarrhoea, flatulence, bloating) and reduced palatability; titrate slowly (VCA, verified_snippet). Cats: reported aversion to MCT (unverified)."
    compatible_forms: [liquid_oil, softgel, powder_sachet (as spray-dried MCT powder)]

  taurine:
    physical_form: white crystalline powder, water soluble
    heat_sensitivity: low (heat stable; losses in canned food are mainly from leaching, unverified)
    moisture_sensitivity: low
    taste: neutral-slightly bitter
    compatible_forms: [all]

  L_carnitine:
    physical_form: powder
    forms:
      - {form: "L-carnitine base (inner salt)", hygroscopic: "highly hygroscopic", status: verified_snippet}
      - {form: "L-carnitine L-tartrate (Carnipure Tartrate)", carnitine_pct: 68, hygroscopic: "non-hygroscopic", status: verified_snippet, source: "https://www.ulprospector.com/en/eu/Food/Detail/3383/94682/Carnipure-Tartrate"}
      - {form: "L-carnitine fumarate", carnitine_pct: 51, status: verified_snippet}
    model_hint: "Use L-tartrate in chews/tablets/capsules and apply a 0.68 conversion. The base form only suits liquids or protected packaging."
    compatible_forms: [capsule, chewable_tablet, soft_chew (tartrate), powder_sachet (tartrate), liquid (base)]

  CoQ10:
    physical_form: orange crystalline powder (ubiquinone); ubiquinol is an oil/reduced form
    melting_point_c: 49
    light_sensitivity: photolabile
    solubility: very poorly water soluble (MW 864); oil solutions/emulsions/solid dispersions/cyclodextrin used for bioavailability
    status: verified_snippet
    source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7997171 (CoQ10 formulation review)"
    heat_note: "Melts at about 49 C, so hot-process chews can cause recrystallisation/segregation (rule_of_thumb). Ubiquinol oxidises readily (unverified)."
    compatible_forms: [softgel, capsule, chewable_tablet, soft_chew]
    form_note: "softgel in oil is best for bioavailability; soft chew only if cold-processed (melting point about 49 C)"

  vitamin_E:
    forms:
      - {form: "RRR-alpha-tocopherol (d-alpha, natural)", iu_per_mg: 1.49, status: verified_snippet, source: "NIH ODS Vitamin E fact sheet https://ods.od.nih.gov/factsheets/VitaminE-HealthProfessional/"}
      - {form: "all-rac-alpha-tocopheryl acetate (dl-, synthetic)", iu_per_mg: 1.0, status: verified_snippet, source: "NIH ODS"}
      - {form: "d-alpha-tocopheryl acetate", iu_per_mg: 1.36, status: unverified}
      - {form: "mixed tocopherols", note: "Used mainly as a process antioxidant for oils (gamma/delta-rich). Low vitamin E activity per mg; do not count toward the vitamin E dose in IU (rule_of_thumb)"}
    stability: "Acetate esters are stable in premixes/chews. Free tocopherols are consumed as they protect oils (unverified)."
    compatible_forms: [all]

  cobalamin:
    forms: [cyanocobalamin, hydroxocobalamin, methylcobalamin]
    light_sensitivity: "Methylcobalamin is highly photolabile and degrades to hydroxocobalamin. Stability: cyanocobalamin > hydroxocobalamin > methylcobalamin. 100 C for 60 min caused 38% cyanocobalamin loss. Ascorbic acid increases methylcobalamin loss (70-76%); sorbitol protects (verified_snippet, IJVNR 90(5-6) doi:10.1024/0300-9831/a000578; IJPS methylcobalamin photodegradation)"
    model_hint: "Use cyanocobalamin in heated/light-exposed forms and opaque packaging. Avoid co-formulating methylcobalamin with ascorbic acid."
    compatible_forms: [chewable_tablet, capsule, soft_chew (cyanocobalamin), liquid (opaque)]

