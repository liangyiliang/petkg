interactions_and_incompatibilities:
  - id: zinc_reduces_copper_absorption
    type: absorption_competition
    detail: "Oral zinc induces enterocyte metallothionein, which binds copper and is shed in faeces. This is used therapeutically (zinc acetate/gluconate) in copper-associated hepatopathy. High zinc in a blend lowers copper status (verified_snippet, VIN/Auburn proceedings)."
    use_in_graph: "Allowed and intended for copper_storage_hepatopathy breeds. Flag as a risk of copper deficiency with chronic high-dose zinc in others."
    source: "https://www.vin.com/doc/?id=3850149 ; ACVIM consensus on copper-associated hepatitis in dogs: Webster CRL et al. J Vet Intern Med 2019 (doi:10.1111/jvim.15516, citation_from_memory: true)"
  - id: avoid_copper_in_copper_hepatopathy_breeds
    type: breed_safety
    detail: "ACVIM panel linked NRC/AAFCO copper levels and bioavailable copper chelates to rising hepatic copper accumulation in dogs. Avoid added copper (esp. chelated) for Bedlington, Labrador, Doberman, WHWT and Dalmatian (verified_snippet)."
  - id: calcium_phytate_reduce_zinc
    type: absorption_competition
    detail: "Excess dietary calcium and phytate bind zinc and lower absorption (zinc-responsive dermatosis syndrome II in fast-growing large/giant breeds, e.g., Great Dane, GSD, Labrador, Doberman) (verified_snippet; https://open.lib.umn.edu/animaldermatology2/chapter/nutritional-related-keratinization-disorders-zinc-responsive-dermatosis-dogs/)"
  - id: calcium_iron_competition
    type: absorption_competition
    detail: "Calcium inhibits non-haem iron absorption (human data; not verified for dogs/cats, unverified)."
  - id: metal_ions_oxidise_PUFA_oils
    type: chemical_incompatibility
    detail: "Fe3+ and Cu2+ catalyse fish-oil oxidation in a concentration-dependent way. Keep iron/copper premixes physically separate from omega-3 oils, or use chelated/encapsulated minerals plus antioxidants (verified_snippet)."
  - id: probiotics_vs_heat_and_antimicrobials
    type: viability
    detail: "Non-spore probiotics do not survive thermal extrusion/baking. Use cold process + low aw, or use spore-formers. Antimicrobial botanicals (garlic/allicin, oregano/thyme oils) in the same matrix may reduce viability (unverified)."
  - id: SAMe_requires_enteric_single_unit
    type: dosage_form_constraint
    detail: "SAMe must be an enteric-coated, blister-packed tablet that is not split or crushed. It cannot go in a chew, powder or capsule blend (verified_snippet). It can be co-formulated with silybin-PC in a coated tablet (Denamarin)."
  - id: chitosan_fibre_binding
    type: absorption_interference
    detail: "Chitosan/psyllium may reduce absorption of co-dosed minerals and fat-soluble actives (unverified). Separate dosing in time."
  - id: methylcobalamin_ascorbate
    type: chemical_incompatibility
    detail: "Ascorbic acid accelerates methylcobalamin degradation (70-76% loss); sorbitol mitigates (verified_snippet)."
  - id: garlic_allium_toxicity
    type: species_safety
    detail: "Allium (garlic is 3-5x more toxic than onion) causes Heinz-body haemolytic anaemia. Cats are most susceptible, then dogs. Concentrated powders/supplements are the main risk. Onion toxicosis reported in cats at 5 g/kg raw onion, and in dogs at 15-30 g/kg raw onion (verified_snippet, MSD/Merck Vet Manual https://www.msdvetmanual.com/toxicology/food-hazards/allium-spp-toxicosis-in-animals). NRC 2009 could not set a safe upper limit for garlic and gave historical/presumed safe intakes only."
  - id: cat_UGT1A6_phenolics
    type: species_safety
    detail: "All cats carry a fixed UGT1A6 pseudogene and lack phenol glucuronidation, so they are very sensitive to acetaminophen, aspirin/salicylates and phenolic essential oils (tea tree, etc.). Treat phenolic botanicals (essential oils, high-dose polyphenols) as cat-caution (verified_snippet; OMIA 001586-9685)."
  - id: alpha_lipoic_acid_cats
    type: species_safety
    detail: "Lipoic acid is about 10x more acutely toxic to cats. Maximum tolerated dose <30 mg/kg, hepatocellular toxicity (Hill AS et al. 2004, verified_snippet). Pet Poison Helpline cites a minimum toxic dose of about 13 mg/kg in cats. Exclude from cat formulas or cap well below this."
  - id: xylitol_dogs
    type: excipient_safety
    detail: "Xylitol is a banned excipient for dog products (hypoglycaemia, liver failure); watch for it in human-derived melatonin/gummy ingredients (FDA, verified_snippet)."
  - id: MDR1_breed_drug_note
    type: breed_safety
    detail: "MDR1 (ABCB1) affects drug transport (ivermectin, loperamide, etc.). No common supplement ingredient is a known P-gp substrate problem, but cannabinoid/hemp and some botanicals that modulate P-gp are uncertain (unverified)."

