life_stage_senior_thresholds:
  dog:
    definition: "AAHA 2019 Canine Life Stage Guidelines: senior = 'the last 25% of estimated lifespan through end of life'. AAHA proposes no fixed ages for mature adult and senior because variation is large."
    status: verified
    sources: ["Creevy KE et al. 2019 AAHA Canine Life Stage Guidelines. JAAHA 2019;55(6):267-290. doi:10.5326/JAAHA-MS-6999 (citation_from_memory: true for vol/pages/DOI)", "2023 AAHA Senior Care Guidelines (Dhaliwal R et al., JAAHA 2023;59:1-21, doi:10.5326/JAAHA-MS-7343), which restate the 25% rule (verified from PDF)"]
    other_stages_aaha2019: "puppy: birth to cessation of rapid growth (about 6-9 months); young adult: to completion of physical/social maturation (about 3-4 years); mature adult: to the start of the last 25% of lifespan (citation_from_memory: true; consistent with AAHA definitions page)"
    computed_rule: "senior_start_years = 0.75 x estimated breed/size median lifespan"
    lifespan_reference: "McMillan KM et al. Sci Rep 2024 'Longevity of companion dog breeds: those at risk from early death' (UK, 584,734 dogs): median 12.5 y overall; purebreds 12.7 y vs crossbreds 12.0 y; large breeds 20% higher hazard of early death than small; brachycephalic breeds median 11.2 y (verified_snippet; doi:10.1038/s41598-023-50458-w)"
    rule_of_thumb_by_size:
      source: "AVMA Senior Pets client brochure: 'Cats and small dogs are generally considered senior at seven years of age... larger-breed dogs ... often considered senior when they are 5 to 6 years of age' (verified_snippet, https://ebusiness.avma.org/files/productdownloads/SeniorPets_En.pdf)"
      derived_defaults_years:
        note: "Defaults from 0.75 x typical lifespan. The lifespans are rule-of-thumb assumptions (unverified), except overall/brachy medians from McMillan 2024."
        toy: {assumed_lifespan_y: 14, senior_start_y: 10.5}
        small: {assumed_lifespan_y: 13.5, senior_start_y: 10}
        medium: {assumed_lifespan_y: 12.5, senior_start_y: 9.5}
        large: {assumed_lifespan_y: 11.5, senior_start_y: 8.5}
        giant: {assumed_lifespan_y: 9, senior_start_y: 7}
      conservative_avma_style_defaults_years: {toy: 7, small: 7, medium: 7, large: 6, giant: 5}
      recommendation: "Use the 0.75 x lifespan rule, with breed-specific lifespan where known. The AVMA ages are a cruder, more conservative trigger (earlier screening)."
