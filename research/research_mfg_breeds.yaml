regulatory_us:
  fda_cvm_status:
    summary: "DSHEA (1994) does not apply to animals; CVM stated this in a Federal Register notice on 22 April 1996. There is no 'dietary supplement' category for animals: products are legally animal food or animal drugs, depending on intended use and claims. Structure/function claims beyond nutrition, taste or aroma can make a product an unapproved new animal drug."
    status: verified_snippet
    sources: ["https://www.nasc.cc/historical-summary/ (verified)", "https://www.aafco.org/resources/startups/definition-of-food-drugs/"]
    ingredient_status: "Animal-food ingredients must be GRAS for the intended use, an approved food additive, or otherwise sanctioned (e.g., an AAFCO OP definition). Many supplement ingredients have none of these and are sold under historical FDA enforcement discretion for low-risk products (verified_snippet re ingredient requirement; enforcement-discretion detail unverified)."
  aafco_and_afic:
    summary: "The FDA-AAFCO MOU (ingredient definitions reviewed by CVM) expired 1 October 2024. AAFCO stopped accepting new definition requests on 1 September 2024. FDA created the Animal Food Ingredient Consultation (AFIC) process; Guidance for Industry #294 was finalised 6 January 2025. Existing AAFCO OP definitions remain under an FDA enforcement-policy guidance."
    status: verified_snippet
    sources: ["https://www.khlaw.com/insights/fda-end-mou-aafco-impact-animal-food-ingredient-review", "https://www.venable.com/insights/publications/2024/08/the-fdaaafco-mou-will-not-be-renewed"]
    graph_use: "Store per ingredient: aafco_defined (bool/OP section), gras_animal (bool), afic_status, and fda_enforcement_discretion_note."
  nasc:
    summary: >
      NASC (formed 2002) runs the voluntary NASC Quality Seal. Requirements include a quality
      control manual with SOPs, adverse event reporting through NAERS (monitors >1,400
      ingredients and >6,000 products; data shared with FDA-CVM), labelling/claims compliance and
      audits. The NASC Preferred Supplier program vets raw-material suppliers and contract
      manufacturers. NASC ingredient data sheets follow the SIDI protocol and test 5 lots per
      ingredient. 'Preferred ingredient list' concept: NASC keeps ingredient-safety information
      and uses the NRC 2009 'historical safe intake (HSI)' and 'presumed safe intake (PSI)'
      framework. Example (NRC 2009 lutein): dog PSI 1.8 mg/kg BW, HSI 0.45 mg/kg; cat PSI
      7.2 mg/kg, HSI 0.85 mg/kg.
    status: verified_snippet
    sources: ["https://www.petfoodindustry.com/articles/449-online-extra-nasc-and-supplement-safety", "https://www.nasc.cc/wp-content/uploads/2017/04/ABC-HerbalEGram-_-Feb-2017_NASC-PS-Program-Focuses-On-Quality-Standards.pdf", "NRC. Safety of Dietary Supplements for Horses, Dogs, and Cats. National Academies Press 2009. https://nap.nationalacademies.org/catalog/12461"]
    unverified: "Whether NASC publishes a formal 'preferred ingredient list' or maximum-inclusion table is unverified. NASC hemp-specific labelling guidelines exist per industry reports but were not checked."
  cbd_hemp:
    federal: "CBD and other hemp-derived substances have no FDA approval as animal drugs and no approved food additive petition, AAFCO definition or GRAS conclusion for animal food. FDA considers CBD-containing animal food adulterated, and CBD products with therapeutic claims are unapproved new animal drugs. CVM has issued warning letters (verified_snippet; https://atwork.avma.org/news/fda-issues-warnings-over-cbd-animals)."
    federal_hemp_definition_change: "P.L. 119-37 (FY2026 Agriculture appropriations, enacted 12 November 2025) redefines hemp to <0.3% total THC (not only delta-9) and excludes final hemp-derived cannabinoid products with >0.4 mg total THC per container. Effective 12 November 2026 (verified_snippet; CRS IN12620 https://www.congress.gov/crs_external_products/IN/PDF/IN12620/IN12620.2.pdf). Check for later amendments or delays near that date."
    california: "AB 45 (signed 6 October 2021) bars restricting the sale of food, dietary supplements, cosmetics or pet food solely because they contain industrial hemp/cannabinoids. Processed pet food manufacturers must register with CDPH (Food and Drug Branch). CDFA regulates hemp cultivation (verified_snippet; https://vicentellp.com/insights/california-ab45-allowing-manufacture-sale-hemp-derived-products-cbd)."
    other_states: "State laws vary. Some (e.g., Montana feed policy) bar hemp in commercial feed except where AAFCO-defined. Treat hemp/CBD as 'excluded from formulation' in the graph unless a state-specific mode is added (verified_snippet re Montana: https://agr.mt.gov/_docs/feed-docs/MT_Hemp_Feed_Policy.pdf)."
    graph_rule: "Exclude CBD/hemp extracts as formulation ingredients for US output (not FDA-permitted). Hemp seed oil/hemp seed products may be treated differently by states; they are also not AAFCO-defined for pet food (unverified for current status)."

