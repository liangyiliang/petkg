cat_formulation_rules_summary:
  - "Preferred forms for cats: liquid_oil/pump, powder_sachet or sprinkle_capsule mixed into food, small palatable soft chew. Tablets/capsules for pilling rank lowest (Taylor 2022)."
  - "Keep dose volume small: about <=0.5-1 g of powder or <=1-2 mL of liquid per day as a starting heuristic (unverified)."
  - "Exclude: alpha-lipoic acid (or cap far below 13 mg/kg), garlic/onion, phenolic essential oils, xylitol, high-dose salicylate-like botanicals (willow bark) (UGT1A6 deficiency)."
  - "Taurine is fine. Cats have an obligate dietary taurine requirement."

least_certain_values:
  - "Soft chew practical active-load ceiling (35%) is drawn from one excipient-maker case study plus patents. Real ceilings depend on the actives and the manufacturer."
  - "Chewable tablet unit mass and active-load ranges are unverified (no tablet weights found)."
  - "Probiotic overage multiplier (2-10x) is unverified. Only the practice of adding overage is sourced."
  - "Pump stroke volume for liquid oils is unverified."
  - "MOQs: only qualitative ('low MOQ') or a single 700 kg overseas listing."
  - "Size-class senior ages are derived (0.75 x assumed lifespan) or AVMA rule of thumb. AAHA gives no fixed canine ages."
  - "Cat breed weight ranges come from secondary charts, not CFA/TICA standards."
  - "Boxer DCM mapping (really ARVC), Siamese renal_amyloidosis mapping (mainly hepatic), Dachshund cystinuria and Burmese CaOx are weak or uncertain."
  - "Glucosamine sulfate base fractions (0.59 KCl / 0.63 NaCl) are my stoichiometric calculations, not vendor specs."
  - "Several journal volume/page/DOI details are tagged citation_from_memory and should be checked."
