# In-market pet supplement label data (US market)
# Retrieved: 2026-10-03
#
# Conventions
#   verification (product-level and per-active "status"):
#     label_confirmed  = read directly from the manufacturer's own product page / label image / manufacturer PDF
#     retailer_listing = read from a large retailer listing (1-800-PetMeds, etc.), manufacturer page blocked or silent
#     unverified       = amount/claim could not be confirmed from a primary or retailer source on retrieval date
#   amount: numeric per ONE unit (unit_name) unless "basis" says otherwise; null = not disclosed / not confirmed
#   CFU written as integers (1e8 = 100000000)
#   nasc_quality_seal: yes | no | unverified  (basis given in nasc_basis)
#   Sources that blocked automated access on 2026-10-03: purina.com / shop.purina.com / proplanvetdirect.com (403),
#   chewy.com (429), nordicnaturals.com -> nordic.com (403), drugs.com (403). Retailer fallbacks used where noted.

meta:
  retrieved: "2026-10-03"
  market: US
  canonical_health_needs: [joint_mobility, skin_coat_barrier, gi_microbiome_stool_quality, gi_mucosal_inflammation,
    cobalamin_repletion, renal_support, phosphate_management, hepatic_support, cognitive_aging, anxiety_stress,
    cardiac_support, urinary_tract_health, weight_lean_mass, immune_support, oral_dental_health]
  nutramax_nasc_note: >-
    No NASC seal appears on any Nutramax product page that was read. A Chewy Q&A answer, seen only in a search
    snippet (Chewy itself returned HTTP 429), says Nutramax chooses not to be an NASC member. Nutramax products are
    recorded as nasc_quality_seal "no", based on that secondary source; the seal was not checked on a physical label.

