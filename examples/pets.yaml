# Synthetic PetProfiles: the shape step 1 hands to step 2. Not real patients.
# Each one is chosen to exercise a different part of the graph.

# Senior large-breed dog: NSAID interaction, liver flag, breed copper predisposition.
- pet_id: demo-luna
  species: species:dog
  breed: breed:labrador_retriever
  age_years: 11
  weight_kg: 34
  ideal_weight_kg: 29   # BCS 7/9: dose on ideal weight
  conditions: [condition:osteoarthritis, condition:hepatopathy, condition:obesity]
  medications: [med:nsaid]
  allergens: []
  needs:
    - {need: need:joint_mobility, priority: 1}
    - {need: need:hepatic_support, priority: 2}
    - {need: need:weight_lean_mass, priority: 3}
    - {need: need:cognitive_aging, priority: 3}

